ect":"mathematik","text":"Tom kauft 4 Hefte zu je 11 € und bezahlt mit einem 60-€-Schein. Wie viel Wechselgeld bekommt er zurück?","options":{"A":"15 €","B":"16 €","C":"14 €","D":"26 €"},"answer":"B","explanation":"Zweischrittige Sachaufgabe — 4 × 11 € = 44 €; 60 € − 44 € = 16 € Wechselgeld."},{"id":"q196","num":46,"subject":"mathematik","text":"Ein Zug fährt jeden Tag eine Strecke von 187 km. Wie viele Kilometer legt er in 5 Tagen zurück?","options":{"A":"935 km","B":"925 km","C":"945 km","D":"835 km"},"answer":"A","explanation":"Multiplikation als Malaufgabe — 187 km × 5 = 935 km."},{"id":"q197","num":47,"subject":"mathematik","text":"Ein Theater hat 15 Reihen mit je 23 Sitzen. An einem Abend sind 260 Plätze belegt. Wie viele Plätze sind frei?","options":{"A":"75","B":"95","C":"65","D":"85"},"answer":"D","explanation":"Zweischrittige Sachaufgabe — 15 × 23 = 345 Plätze insgesamt; 345 − 260 = 85 freie Plätze."},{"id":"q198","num":48,"subject":"mathematik","text":"583 Bonbons werden gleichmäßig auf 8 Kinder verteilt. Wie viele Bonbons bekommt jedes Kind, und wie viele bleiben übrig?","options":{"A":"71 Bonbons, Rest 15","B":"72 Bonbons, Rest 0","C":"73 Bonbons, Rest 7","D":"72 Bonbons, Rest 7"},"answer":"D","explanation":"Division mit Rest als Sachaufgabe — 583 : 8 = 72 Rest 7, denn 72 × 8 = 576 und 583 − 576 = 7."},{"id":"q199","num":49,"subject":"mathematik","text":"Frau Klein verdient monatlich 3.175 €. Wie viel verdient sie in 4 Monaten?","options":{"A":"12.600 €","B":"12.700 €","C":"12.800 €","D":"11.700 €"},"answer":"B","explanation":"Multiplikation als Malaufgabe — 3.175 € × 4 = 12.700 €."},{"id":"q200","num":50,"subject":"mathematik","text":"Ein Geschäft verkauft am Montag 145 Stifte und am Dienstag doppelt so viele. Wie viele Stifte wurden an beiden Tagen zusammen verkauft?","options":{"A":"290","B":"425","C":"445","D":"435"},"answer":"D","explanation":"Zweischrittige Sachaufgabe — Dienstag: 145 × 2 = 290; insgesamt: 145 + 290 = 435 Stifte."}]},{"testNum":15,"title":"Mathematik: Raum und Form (Kapitel 8–9)","subject":"mathematik","chapter":"Raum und Form","kapitel":"Kapitel 8–9","type":"topic","questions":[{"id":"q201","num":1,"subject":"mathematik","text":"Wie viele Seiten hat ein Rechteck?","options":{"A":"drei","B":"vier","C":"fünf","D":"sechs"},"answer":"B","explanation":"Seiten des Rechtecks — Ein Rechteck besitzt immer genau vier Seiten und vier rechte Winkel."},{"id":"q202","num":2,"subject":"mathematik","text":"Was zeichnet einen Kreis besonders aus?","options":{"A":"Er hat vier rechte Winkel.","B":"Jeder Punkt der Randlinie hat den gleichen Abstand zum Mittelpunkt.","C":"Er hat drei Seiten.","D":"Er hat acht Ecken."},"answer":"B","explanation":"Merkmal des Kreises — Alle Punkte auf dem Rand eines Kreises sind gleich weit vom Mittelpunkt entfernt, das macht den Kreis rund."},{"id":"q203","num":3,"subject":"mathematik","text":"Ein Dreieck hat einen Winkel von genau 90°. Wie nennt man diesen Winkel?","options":{"A":"gestreckter Winkel","B":"spitzer Winkel","C":"rechter Winkel","D":"stumpfer Winkel"},"answer":"C","explanation":"Rechter Winkel — Ein Winkel von genau 90° heißt rechter Winkel und wird oft mit einem kleinen Quadrat markiert."},{"id":"q204","num":4,"subject":"mathematik","text":"Welche Figur hat vier Ecken und vier Seiten, aber nicht zwingend gleich lange Seiten oder rechte Winkel?","options":{"A":"Kreis","B":"Dreieck","C":"Quadrat","D":"Viereck"},"answer":"D","explanation":"Allgemeines Viereck — Ein Viereck hat stets vier Ecken und vier Seiten; Quadrat und Rechteck sind nur besondere Sonderformen davon."},{"id":"q205","num":5,"subject":"mathematik","text":"Welche der folgenden Figuren hat garantiert vier rechte Winkel?","options":{"A":"Rechteck","B":"Dreieck","C":"Kreis","D":"beliebiges Viereck"},"answer":"A","explanation":"Rechte Winkel im Rechteck — Ein Rechteck besitzt per Definition immer vier rechte Winkel, unabhängig von der Länge seiner Seiten."},{"id":"q206","num":6,"subject":"mathematik","text":"Welche Aussage passt zu einem gleichseitigen Dreieck?","options":{"A":"Nur zwei Seiten sind gleich lang.","B":"Alle drei Seiten sind gleich lang.","C":"Keine Seite ist gleich lang.","D":"Es hat vier Seiten."},"answer":"B","explanation":"Gleichseitiges Dreieck — Bei einem gleichseitigen Dreieck sind alle drei Seiten und auch alle drei Winkel gleich groß."},{"id":"q207","num":7,"subject":"mathematik","text":"Welche Eigenschaft hat ein rechtwinkliges Dreieck?","options":{"A":"Alle Winkel sind gleich groß.","B":"Es hat keinen rechten Winkel.","C":"Genau einer seiner Winkel ist ein rechter Winkel (90°).","D":"Es hat vier Ecken."},"answer":"C","explanation":"Rechtwinkliges Dreieck — Ein rechtwinkliges Dreieck besitzt genau einen Winkel von 90°, die anderen beiden Winkel sind kleiner."},{"id":"q208","num":8,"subject":"mathematik","text":"Was ist ein gemeinsames Merkmal von Rechteck und Quadrat?","options":{"A":"Beide haben drei Ecken.","B":"Beide besitzen vier rechte Winkel.","C":"Beide haben keine geraden Seiten.","D":"Beide sind rund."},"answer":"B","explanation":"Gemeinsamkeit von Rechteck und Quadrat — Sowohl Rechteck als auch Quadrat besitzen vier rechte Winkel; das Quadrat hat zusätzlich vier gleich lange Seiten."},{"id":"q209","num":9,"subject":"mathematik","text":"Wodurch lässt sich ein gleichschenkliges Dreieck erkennen?","options":{"A":"Alle Seiten sind unterschiedlich lang.","B":"Mindestens zwei Seiten sind gleich lang.","C":"Es hat einen rechten Winkel.","D":"Es hat vier Seiten."},"answer":"B","explanation":"Gleichschenkliges Dreieck — Ein gleichschenkliges Dreieck besitzt mindestens zwei gleich lange Seiten, die sogenannten Schenkel."},{"id":"q210","num":10,"subject":"mathematik","text":"Was ist eine Diagonale in einem Viereck?","options":{"A":"eine Verbindungslinie zwischen zwei gegenüberliegenden Ecken","B":"eine Seite des Vierecks","C":"der Umfang des Vierecks","D":"ein rechter Winkel"},"answer":"A","explanation":"Begriff Diagonale — Eine Diagonale verbindet zwei Ecken eines Vierecks, die nicht direkt durch eine Seite verbunden sind."},{"id":"q211","num":11,"subject":"mathematik","text":"Ein Rechteck ist 10 cm lang und 3 cm breit. Wie groß ist sein Umfang?","options":{"A":"26 cm","B":"13 cm","C":"30 cm²","D":"26 cm²"},"answer":"A","explanation":"Umfang eines Rechtecks — Umfang = 2 × (10 + 3) = 2 × 13 = 26 cm. 13 cm entsteht, wenn man die Verdopplung vergisst."},{"id":"q212","num":12,"subject":"mathematik","text":"Ein Quadrat hat eine Seitenlänge von 6 cm. Wie groß ist sein Umfang?","options":{"A":"12 cm","B":"36 cm²","C":"24 cm","D":"24 cm²"},"answer":"C","explanation":"Umfang eines Quadrats — Umfang = 4 × 6 = 24 cm. 36 cm² wäre der Flächeninhalt, nicht der Umfang."},{"id":"q213","num":13,"subject":"mathematik","text":"Ein Rechteck ist 13 cm lang und 5 cm breit. Wie groß ist sein Umfang?","options":{"A":"18 cm","B":"65 cm²","C":"36 cm","D":"36 cm²"},"answer":"C","explanation":"Umfang eines Rechtecks — Umfang = 2 × (13 + 5) = 2 × 18 = 36 cm. 18 cm ergibt sich, wenn die Verdopplung fehlt."},{"id":"q214","num":14,"subject":"mathematik","text":"Ein Quadrat hat eine Seitenlänge von 12 cm. Wie groß ist sein Umfang?","options":{"A":"24 cm","B":"144 cm²","C":"48 cm²","D":"48 cm"},"answer":"D","explanation":"Umfang eines Quadrats — Umfang = 4 × 12 = 48 cm. 144 cm² wäre fälschlich der Flächeninhalt (12 × 12)."},{"id":"q215","num":15,"subject":"mathematik","text":"Ein Rechteck ist 16 cm lang und 7 cm breit. Wie groß ist sein Umfang?","options":{"A":"46 cm","B":"23 cm","C":"112 cm²","D":"46 cm²"},"answer":"A","explanation":"Umfang eines Rechtecks — Umfang = 2 × (16 + 7) = 2 × 23 = 46 cm. 23 cm ergibt sich ohne die Verdopplung."},{"id":"q216","num":16,"subject":"mathematik","text":"Ein Quadrat hat eine Seitenlänge von 13 cm. Wie groß ist sein Umfang?","options":{"A":"26 cm","B":"169 cm²","C":"52 cm","D":"52 cm²"},"answer":"C","explanation":"Umfang eines Quadrats — Umfang = 4 × 13 = 52 cm. 26 cm entsteht, wenn man nur verdoppelt statt vervierfacht."},{"id":"q217","num":17,"subject":"mathematik","text":"Eine zusammengesetzte Figur hat nacheinander die Seitenlängen 9 cm, 2 cm, 6 cm, 3 cm, 3 cm und 5 cm. Wie groß ist ihr Umfang?","options":{"A":"26 cm","B":"25 cm²","C":"30 cm","D":"28 cm"},"answer":"D","explanation":"Umfang einer zusammengesetzten Figur — Umfang = 9+2+6+3+3+5 = 28 cm. Bei zusammengesetzten Figuren werden alle Außenseiten addiert."},{"id":"q218","num":18,"subject":"mathematik","text":"Ein Quadrat hat eine Seitenlänge von 14 cm. Wie groß ist sein Umfang?","options":{"A":"28 cm","B":"56 cm","C":"196 cm²","D":"56 cm²"},"answer":"B","explanation":"Umfang eines Quadrats — Umfang = 4 × 14 = 56 cm. 28 cm entsteht, wenn man nur verdoppelt statt vervierfacht."},{"id":"q219","num":19,"subject":"mathematik","text":"Ein Rechteck ist 20 cm lang und 9 cm breit. Wie groß ist sein Umfang?","options":{"A":"29 cm","B":"58 cm","C":"180 cm²","D":"58 cm²"},"answer":"B","explanation":"Umfang eines Rechtecks — Umfang = 2 × (20 + 9) = 2 × 29 = 58 cm. 29 cm ergibt sich ohne die Verdopplung."},{"id":"q220","num":20,"subject":"mathematik","text":"Eine zusammengesetzte Figur hat nacheinander die Seitenlängen 5 cm, 3 cm, 4 cm, 2 cm, 3 cm und 4 cm. Wie groß ist ihr Umfang?","options":{"A":"20 cm","B":"21 cm²","C":"21 cm","D":"24 cm"},"answer":"C","explanation":"Umfang einer zusammengesetzten Figur — Umfang = 5+3+4+2+3+4 = 21 cm. Alle sechs Seitenlängen müssen einzeln addiert werden."},{"id":"q221","num":21,"subject":"mathematik","text":"Ein Rechteck ist 11 cm lang und 6 cm breit. Wie groß ist sein Flächeninhalt?","options":{"A":"34 cm","B":"17 cm²","C":"66 cm","D":"66 cm²"},"answer":"D","explanation":"Flächeninhalt eines Rechtecks — Flächeninhalt = 11 × 6 = 66 cm². 34 cm wäre der Umfang, nicht der Flächeninhalt."},{"id":"q222","num":22,"subject":"mathematik","text":"Ein Quadrat hat eine Seitenlänge von 12 cm. Wie groß ist sein Flächeninhalt?","options":{"A":"48 cm","B":"24 cm²","C":"144 cm²","D":"144 cm"},"answer":"C","explanation":"Flächeninhalt eines Quadrats — Flächeninhalt = 12 × 12 = 144 cm². 24 cm² entsteht, wenn man die Seitenlänge nur verdoppelt statt quadriert."},{"id":"q223","num":23,"subject":"mathematik","text":"Ein Rechteck ist 14 cm lang und 3 cm breit. Wie groß ist sein Flächeninhalt?","options":{"A":"34 cm","B":"42 cm²","C":"17 cm²","D":"42 cm"},"answer":"B","explanation":"Flächeninhalt eines Rechtecks — Flächeninhalt = 14 × 3 = 42 cm². 17 cm² entsteht, wenn die Seiten nur addiert statt multipliziert werden."},{"id":"q224","num":24,"subject":"mathematik","text":"Ein Quadrat hat eine Seitenlänge von 11 cm. Wie groß ist sein Flächeninhalt?","options":{"A":"44 cm","B":"22 cm²","C":"121 cm²","D":"121 cm"},"answer":"C","explanation":"Flächeninhalt eines Quadrats — Flächeninhalt = 11 × 11 = 121 cm². 22 cm² entsteht, wenn man die Seitenlänge nur verdoppelt statt quadriert."},{"id":"q225","num":25,"subject":"mathematik","text":"Ein Rechteck ist 15 cm lang und 4 cm breit. Wie groß ist sein Flächeninhalt?","options":{"A":"38 cm","B":"19 cm²","C":"30 cm²","D":"60 cm²"},"answer":"D","explanation":"Flächeninhalt eines Rechtecks — Flächeninhalt = 15 × 4 = 60 cm². 38 cm wäre der Umfang, nicht der Flächeninhalt."},{"id":"q226","num":26,"subject":"mathematik","text":"Ein Quadrat hat eine Seitenlänge von 14 cm. Wie groß ist sein Flächeninhalt?","options":{"A":"56 cm","B":"28 cm²","C":"196 cm²","D":"196 cm"},"answer":"C","explanation":"Flächeninhalt eines Quadrats — Flächeninhalt = 14 × 14 = 196 cm². 28 cm² entsteht, wenn man die Seitenlänge nur verdoppelt statt quadriert."},{"id":"q227","num":27,"subject":"mathematik","text":"Ein rechteckiges Grundstück ist 8 m lang und 5 m breit. Wie groß ist sein Flächeninhalt?","options":{"A":"40 m²","B":"26 m","C":"13 m²","D":"40 m"},"answer":"A","explanation":"Flächeninhalt in Quadratmetern — Flächeninhalt = 8 × 5 = 40 m². Bei Flächen in Metern lautet die Einheit Quadratmeter (m²)."},{"id":"q228","num":28,"subject":"mathematik","text":"Ein Quadrat hat eine Seitenlänge von 13 cm. Wie groß ist sein Flächeninhalt?","options":{"A":"52 cm","B":"169 cm²","C":"26 cm²","D":"169 cm"},"answer":"B","explanation":"Flächeninhalt eines Quadrats — Flächeninhalt = 13 × 13 = 169 cm². 26 cm² entsteht, wenn man die Seitenlänge nur verdoppelt statt quadriert."},{"id":"q229","num":29,"subject":"mathematik","text":"Ein rechteckiges Grundstück ist 9 m lang und 6 m breit. Wie groß ist sein Flächeninhalt?","options":{"A":"30 m","B":"15 m²","C":"54 m²","D":"54 m"},"answer":"C","explanation":"Flächeninhalt in Quadratmetern — Flächeninhalt = 9 × 6 = 54 m². 15 m² entsteht, wenn die Seiten nur addiert statt multipliziert werden."},{"id":"q230","num":30,"subject":"mathematik","text":"Ein Quadrat hat eine Seitenlänge von 15 cm. Wie groß ist sein Flächeninhalt?","options":{"A":"60 cm","B":"30 cm²","C":"225 cm²","D":"225 cm"},"answer":"C","explanation":"Flächeninhalt eines Quadrats — Flächeninhalt = 15 × 15 = 225 cm². 30 cm² entsteht, wenn man die Seitenlänge nur verdoppelt statt quadriert."},{"id":"q231","num":31,"subject":"mathematik","text":"Wie viele Kanten besitzt ein Quader insgesamt?","options":{"A":"6","B":"8","C":"10","D":"12"},"answer":"D","explanation":"Kanten des Quaders — Ein Quader besitzt, genau wie ein Würfel, zwölf Kanten."},{"id":"q232","num":32,"subject":"mathematik","text":"Wie viele Kanten treffen an jeder Ecke eines Würfels zusammen?","options":{"A":"1","B":"2","C":"4","D":"3"},"answer":"D","explanation":"Kanten an einer Würfelecke — An jeder der acht Ecken eines Würfels laufen genau drei Kanten zusammen."},{"id":"q233","num":33,"subject":"mathematik","text":"Welche Grundfläche sieht man, wenn man einen Würfel von oben betrachtet?","options":{"A":"ein Rechteck","B":"ein Kreis","C":"ein Quadrat","D":"ein Dreieck"},"answer":"C","explanation":"Draufsicht des Würfels — Da alle Flächen eines Würfels Quadrate sind, erscheint auch die Draufsicht als Quadrat."},{"id":"q234","num":34,"subject":"mathematik","text":"Welcher Körper entsteht, wenn man ein passendes Netz aus sechs gleich großen Quadraten korrekt zusammenfaltet?","options":{"A":"ein Quader","B":"eine Kugel","C":"ein Zylinder","D":"ein Würfel"},"answer":"D","explanation":"Würfel aus Netz falten — Ein Netz aus sechs gleich großen Quadraten ergibt beim richtigen Falten stets einen Würfel."},{"id":"q235","num":35,"subject":"mathematik","text":"Wie viele Flächen besitzt ein Würfel insgesamt?","options":{"A":"6","B":"8","C":"4","D":"12"},"answer":"A","explanation":"Flächen des Würfels — Ein Würfel besitzt sechs gleich große, quadratische Flächen."},{"id":"q236","num":36,"subject":"mathematik","text":"Welche Form haben die Flächen eines Quaders in der Regel?","options":{"A":"Kreise","B":"Dreiecke","C":"Rechtecke","D":"Fünfecke"},"answer":"C","explanation":"Form der Quaderflächen — Die sechs Flächen eines Quaders sind in der Regel Rechtecke, jeweils gegenüberliegende Flächen sind gleich groß."},{"id":"q237","num":37,"subject":"mathematik","text":"Welcher Körper hat zwei kreisförmige Flächen und eine gebogene Fläche, aber keine Ecken?","options":{"A":"der Würfel","B":"der Quader","C":"der Kegel","D":"der Zylinder"},"answer":"D","explanation":"Merkmale des Zylinders — Ein Zylinder besitzt zwei kreisförmige Flächen (Grund- und Deckfläche) und eine gebogene Mantelfläche, jedoch keine Ecken."},{"id":"q238","num":38,"subject":"mathematik","text":"Wie viele Ecken besitzt ein Quader?","options":{"A":"8","B":"6","C":"10","D":"4"},"answer":"A","explanation":"Ecken des Quaders — Ein Quader besitzt, genau wie ein Würfel, acht Ecken."},{"id":"q239","num":39,"subject":"mathematik","text":"Welche Aussage über die Kanten eines Würfels ist richtig?","options":{"A":"Nur vier Kanten sind gleich lang.","B":"Alle 12 Kanten sind gleich lang.","C":"Es gibt keine gleich langen Kanten.","D":"Nur die Kanten der Grundfläche sind gleich lang."},"answer":"B","explanation":"Kantenlängen des Würfels — Da alle Flächen eines Würfels gleich große Quadrate sind, sind auch alle 12 Kanten gleich lang."},{"id":"q240","num":40,"subject":"mathematik","text":"Ein Würfel hat 8 Ecken und 12 Kanten. Wie groß ist die Summe aus Ecken- und Kantenzahl?","options":{"A":"20","B":"18","C":"24","D":"12"},"answer":"A","explanation":"Summe von Ecken und Kanten — 8 Ecken + 12 Kanten = 20. Diese Aufgabe übt das genaue Zusammenzählen der Bauteile eines Würfels."},{"id":"q241","num":41,"subject":"mathematik","text":"Wie viele Symmetrieachsen besitzt ein gleichseitiges Dreieck?","options":{"A":"1","B":"3","C":"2","D":"0"},"answer":"B","explanation":"Symmetrieachsen des gleichseitigen Dreiecks — Ein gleichseitiges Dreieck besitzt genau drei Symmetrieachsen, jeweils von einer Ecke zur Mitte der gegenüberliegenden Seite."},{"id":"q242","num":42,"subject":"mathematik","text":"Wie viele Symmetrieachsen besitzt ein gleichschenkliges Dreieck, das kein gleichseitiges Dreieck ist?","options":{"A":"0","B":"1","C":"2","D":"3"},"answer":"B","explanation":"Symmetrieachsen des gleichschenkligen Dreiecks — Ein solches Dreieck besitzt genau eine Symmetrieachse, die durch die Spitze und die Mitte der Grundseite verläuft."},{"id":"q243","num":43,"subject":"mathematik","text":"Was ist bei jedem Punkt einer Figur und seinem gespiegelten Punkt an der Spiegelachse der Fall?","options":{"A":"Beide Punkte haben den gleichen Abstand zur Spiegelachse.","B":"Der gespiegelte Punkt liegt immer näher an der Achse.","C":"Der Abstand verändert sich zufällig.","D":"Es gibt keinen Zusammenhang."},"answer":"A","explanation":"Abstand bei der Spiegelung — Ein Punkt und sein Spiegelbild liegen stets im gleichen Abstand zur Spiegelachse, nur auf gegenüberliegenden Seiten."},{"id":"q244","num":44,"subject":"mathematik","text":"Wie nennt man Figuren, die durch Verschieben, Drehen oder Spiegeln exakt zur Deckung gebracht werden können?","options":{"A":"ähnliche Figuren","B":"verschiedene Figuren","C":"unregelmäßige Figuren","D":"kongruente Figuren"},"answer":"D","explanation":"Begriff Kongruenz — Figuren, die in Größe und Form vollständig übereinstimmen, nennt man kongruent."},{"id":"q245","num":45,"subject":"mathematik","text":"Was versteht man unter der Drehsymmetrie einer Figur?","options":{"A":"Die Figur hat keine Symmetrieachse.","B":"Die Figur kann nur verschoben werden.","C":"Die Figur ist immer ein Kreis.","D":"Die Figur sieht nach einer Drehung um einen bestimmten Winkel um ihren Mittelpunkt wieder genauso aus."},"answer":"D","explanation":"Begriff Drehsymmetrie — Eine drehsymmetrische Figur deckt sich nach einer Drehung um ihren Mittelpunkt wieder mit ihrer ursprünglichen Form."},{"id":"q246","num":46,"subject":"mathematik","text":"Wie viele kleine, gleich große Würfel bilden einen großen Würfel, wenn man ihn in jeder Richtung (Länge, Breite, Höhe) in drei gleiche Teile zerlegt?","options":{"A":"27","B":"9","C":"18","D":"6"},"answer":"A","explanation":"Zerlegung eines Würfels — 3 × 3 × 3 = 27 kleine Würfel. Man muss Länge, Breite und Höhe jeweils dreifach berücksichtigen."},{"id":"q247","num":47,"subject":"mathematik","text":"Ein Turm besteht aus drei gleich großen Würfeln, die genau übereinandergestapelt sind. Wie viele Flächen der einzelnen Würfel liegen aneinander und sind von außen nicht mehr sichtbar?","options":{"A":"4","B":"2","C":"6","D":"8"},"answer":"A","explanation":"Verdeckte Flächen im Würfelturm — Zwischen den drei Würfeln gibt es zwei Kontaktstellen, an denen jeweils zwei Flächen aneinanderliegen, also insgesamt 4 verdeckte Flächen."},{"id":"q248","num":48,"subject":"mathematik","text":"Wie viele Symmetrieachsen besitzt ein regelmäßiges Sechseck?","options":{"A":"2","B":"3","C":"4","D":"6"},"answer":"D","explanation":"Symmetrieachsen des regelmäßigen Sechsecks — Ein regelmäßiges Sechseck besitzt genau sechs Symmetrieachsen."},{"id":"q249","num":49,"subject":"mathematik","text":"Welche Eigenschaft bleibt bei einer Drehung einer Figur um einen festen Punkt erhalten?","options":{"A":"Nur die Farbe","B":"Größe und Form der Figur","C":"Nur ihre Lage","D":"Gar keine Eigenschaft"},"answer":"B","explanation":"Erhaltene Eigenschaften bei Drehung — Bei einer Drehung ändert sich nur die Ausrichtung der Figur, Größe und Form bleiben vollständig erhalten."},{"id":"q250","num":50,"subject":"mathematik","text":"Wie nennt man den festen Punkt, um den eine Figur bei einer Drehung gedreht wird?","options":{"A":"das Drehzentrum","B":"die Spiegelachse","C":"der Mittelpunkt der Verschiebung","D":"die Symmetrieachse"},"answer":"A","explanation":"Begriff Drehzentrum — Der feste Punkt, um den eine Figur gedreht wird, heißt Drehzentrum oder Drehpunkt."}]},{"testNum":16,"title":"Mathematik: Daten und Zufall (Kapitel 10)","subject":"mathematik","chapter":"Daten und Zufall","kapitel":"Kapitel 10","type":"topic","questions":[{"id":"q251","num":1,"subject":"mathematik","text":"Auf einer Straße wurden in einer Stunde folgende Fahrzeuge gezählt und in einem Balkendiagramm dargestellt: Autos 28, Fahrräder 16, Busse 6, Lkw 10. Wie viele Fahrräder wurden gezählt?","options":{"A":"6 Fahrräder","B":"16 Fahrräder","C":"28 Fahrräder","D":"10 Fahrräder"},"answer":"B","explanation":"Wert direkt ablesen — Der Balken für Fahrräder zeigt den Wert 16, dieser wird direkt aus dem Diagramm abgelesen."},{"id":"q252","num":2,"subject":"mathematik","text":"Dasselbe Diagramm (Autos 28, Fahrräder 16, Busse 6, Lkw 10): Welches Fahrzeug wurde am häufigsten gezählt?","options":{"A":"Busse","B":"Lkw","C":"Fahrräder","D":"Autos"},"answer":"D","explanation":"Höchsten Balken bestimmen — Der Balken für Autos ist mit 28 Zählungen am höchsten, also das häufigste Fahrzeug."},{"id":"q253","num":3,"subject":"mathematik","text":"Dasselbe Diagramm (Autos 28, Fahrräder 16, Busse 6, Lkw 10): Wie viele Fahrzeuge mehr wurden bei den Autos gezählt als bei den Lkw?","options":{"A":"12","B":"22","C":"18","D":"14"},"answer":"C","explanation":"Differenz zweier Balken — 28 minus 10 ergibt 18, also wurden 18 Fahrzeuge mehr bei den Autos gezählt als bei den Lkw."},{"id":"q254","num":4,"subject":"mathematik","text":"Dasselbe Diagramm (Autos 28, Fahrräder 16, Busse 6, Lkw 10): Wie viele Fahrzeuge wurden insgesamt gezählt?","options":{"A":"54 Fahrzeuge","B":"60 Fahrzeuge","C":"66 Fahrzeuge","D":"50 Fahrzeuge"},"answer":"B","explanation":"Gesamtsumme aus dem Diagramm — 28 + 16 + 6 + 10 ergibt 60, also wurden insgesamt 60 Fahrzeuge gezählt."},{"id":"q255","num":5,"subject":"mathematik","text":"Dasselbe Diagramm (Autos 28, Fahrräder 16, Busse 6, Lkw 10): Wie viele Fahrzeuge waren Busse oder Lkw zusammen?","options":{"A":"10","B":"16","C":"22","D":"6"},"answer":"B","explanation":"Summe zweier Balken — 6 plus 10 ergibt 16, also waren 16 Fahrzeuge Busse oder Lkw."},{"id":"q256","num":6,"subject":"mathematik","text":"Ein Balkendiagramm zeigt, wie viele Bücher jede Klasse in einer Woche in der Schülerbücherei ausgeliehen hat: Klasse 4a 22, Klasse 4b 30, Klasse 4c 18, Klasse 4d 14. Wie viele Bücher hat Klasse 4c ausgeliehen?","options":{"A":"18 Bücher","B":"22 Bücher","C":"30 Bücher","D":"14 Bücher"},"answer":"A","explanation":"Wert direkt ablesen — Der Balken für Klasse 4c zeigt den Wert 18, dieser wird direkt aus dem Diagramm abgelesen."},{"id":"q257","num":7,"subject":"mathematik","text":"Dasselbe Diagramm (4a 22, 4b 30, 4c 18, 4d 14): Welche Klasse hat am wenigsten Bücher ausgeliehen?","options":{"A":"Klasse 4a","B":"Klasse 4b","C":"Klasse 4c","D":"Klasse 4d"},"answer":"D","explanation":"Niedrigsten Balken bestimmen — Der Balken für Klasse 4d ist mit 14 Büchern am niedrigsten, also die Klasse mit den wenigsten Ausleihen."},{"id":"q258","num":8,"subject":"mathematik","text":"Dasselbe Diagramm (4a 22, 4b 30, 4c 18, 4d 14): Wie viele Bücher hat Klasse 4b mehr ausgeliehen als Klasse 4d?","options":{"A":"12 Bücher","B":"14 Bücher","C":"16 Bücher","D":"18 Bücher"},"answer":"C","explanation":"Differenz zweier Balken — 30 minus 14 ergibt 16, also hat Klasse 4b 16 Bücher mehr ausgeliehen als Klasse 4d."},{"id":"q259","num":9,"subject":"mathematik","text":"Dasselbe Diagramm (4a 22, 4b 30, 4c 18, 4d 14): Wie viele Bücher wurden insgesamt von allen vier Klassen ausgeliehen?","options":{"A":"80 Bücher","B":"84 Bücher","C":"88 Bücher","D":"76 Bücher"},"answer":"B","explanation":"Gesamtsumme aus dem Diagramm — 22 + 30 + 18 + 14 ergibt 84, also wurden insgesamt 84 Bücher ausgeliehen."},{"id":"q260","num":10,"subject":"mathematik","text":"Dasselbe Diagramm (4a 22, 4b 30, 4c 18, 4d 14): Wie viele Bücher liehen Klasse 4a und Klasse 4c zusammen aus?","options":{"A":"36 Bücher","B":"40 Bücher","C":"44 Bücher","D":"48 Bücher"},"answer":"B","explanation":"Summe zweier Balken — 22 plus 18 ergibt 40, also liehen Klasse 4a und Klasse 4c zusammen 40 Bücher aus."},{"id":"q261","num":11,"subject":"mathematik","text":"Ein Kind hat notiert, wie viele Minuten es täglich für Hausaufgaben braucht: Montag 25, Dienstag 30, Mittwoch 20, Donnerstag 35, Freitag 15. Wie viele Minuten hat das Kind am Mittwoch für Hausaufgaben gebraucht?","options":{"A":"20 Minuten","B":"25 Minuten","C":"30 Minuten","D":"35 Minuten"},"answer":"A","explanation":"Wert aus der Tabelle ablesen — In der Zeile „Mittwoch“ steht der Wert 20, dieser wird direkt aus der Tabelle abgelesen."},{"id":"q262","num":12,"subject":"mathematik","text":"Dieselbe Tabelle (Mo 25, Di 30, Mi 20, Do 35, Fr 15): An welchem Tag hat das Kind am längsten für Hausaufgaben gebraucht?","options":{"A":"Montag","B":"Dienstag","C":"Mittwoch","D":"Donnerstag"},"answer":"D","explanation":"Größten Tabellenwert finden — Mit 35 Minuten ist Donnerstag der Tag mit dem größten Wert in der Tabelle."},{"id":"q263","num":13,"subject":"mathematik","text":"Dieselbe Tabelle (Mo 25, Di 30, Mi 20, Do 35, Fr 15): Wie viele Minuten hat das Kind am Montag und am Freitag zusammen für Hausaufgaben gebraucht?","options":{"A":"30 Minuten","B":"35 Minuten","C":"45 Minuten","D":"40 Minuten"},"answer":"D","explanation":"Zwei Tabellenwerte addieren — 25 plus 15 ergibt 40, also hat das Kind an diesen beiden Tagen zusammen 40 Minuten gebraucht."},{"id":"q264","num":14,"subject":"mathematik","text":"Dieselbe Tabelle (Mo 25, Di 30, Mi 20, Do 35, Fr 15): Wie viele Minuten länger hat das Kind am Donnerstag für Hausaufgaben gebraucht als am Freitag?","options":{"A":"20 Minuten","B":"15 Minuten","C":"25 Minuten","D":"10 Minuten"},"answer":"A","explanation":"Differenz zweier Tabellenwerte — 35 minus 15 ergibt 20, also hat das Kind am Donnerstag 20 Minuten länger gebraucht als am Freitag."},{"id":"q265","num":15,"subject":"mathematik","text":"Dieselbe Tabelle (Mo 25, Di 30, Mi 20, Do 35, Fr 15): Wie viele Minuten hat das Kind insgesamt in der Woche (Montag bis Freitag) für Hausaufgaben gebraucht?","options":{"A":"115 Minuten","B":"120 Minuten","C":"125 Minuten","D":"130 Minuten"},"answer":"C","explanation":"Alle Tabellenwerte addieren — 25 + 30 + 20 + 35 + 15 ergibt 125, also hat das Kind in der Woche insgesamt 125 Minuten gebraucht."},{"id":"q266","num":16,"subject":"mathematik","text":"In einer Bäckerei wurden an vier Tagen folgende Anzahl an Brötchen verkauft: Montag 80, Dienstag 95, Mittwoch 70, Donnerstag 105. Wie viele Brötchen wurden am Dienstag verkauft?","options":{"A":"80 Brötchen","B":"95 Brötchen","C":"70 Brötchen","D":"105 Brötchen"},"answer":"B","explanation":"Wert aus der Tabelle ablesen — In der Zeile „Dienstag“ steht der Wert 95, dieser wird direkt aus der Tabelle abgelesen."},{"id":"q267","num":17,"subject":"mathematik","text":"Dieselbe Tabelle (Mo 80, Di 95, Mi 70, Do 105): An welchem Tag wurden am wenigsten Brötchen verkauft?","options":{"A":"Montag","B":"Dienstag","C":"Mittwoch","D":"Donnerstag"},"answer":"C","explanation":"Kleinsten Tabellenwert finden — Mit 70 verkauften Brötchen ist Mittwoch der Tag mit dem kleinsten Wert."},{"id":"q268","num":18,"subject":"mathematik","text":"Dieselbe Tabelle (Mo 80, Di 95, Mi 70, Do 105): Wie viele Brötchen wurden an den vier Tagen insgesamt verkauft?","options":{"A":"350 Brötchen","B":"340 Brötchen","C":"360 Brötchen","D":"345 Brötchen"},"answer":"A","explanation":"Alle Tabellenwerte addieren — 80 + 95 + 70 + 105 ergibt 350, also wurden insgesamt 350 Brötchen verkauft."},{"id":"q269","num":19,"subject":"mathematik","text":"Dieselbe Tabelle (Mo 80, Di 95, Mi 70, Do 105): Wie viele Brötchen wurden am Donnerstag mehr verkauft als am Mittwoch?","options":{"A":"30 Brötchen","B":"35 Brötchen","C":"40 Brötchen","D":"25 Brötchen"},"answer":"B","explanation":"Differenz zweier Tabellenwerte — 105 minus 70 ergibt 35, also wurden am Donnerstag 35 Brötchen mehr verkauft als am Mittwoch."},{"id":"q270","num":20,"subject":"mathematik","text":"Dieselbe Tabelle (Mo 80, Di 95, Mi 70, Do 105): Wie viele Brötchen wurden am Montag und am Mittwoch zusammen verkauft?","options":{"A":"140 Brötchen","B":"150 Brötchen","C":"160 Brötchen","D":"145 Brötchen"},"answer":"B","explanation":"Zwei Tabellenwerte addieren — 80 plus 70 ergibt 150, also wurden am Montag und Mittwoch zusammen 150 Brötchen verkauft."},{"id":"q271","num":21,"subject":"mathematik","text":"Ein Kind ist an vier Tagen folgende Anzahl an Kilometern mit dem Fahrrad gefahren: 8, 6, 10, 8. Wie hoch ist die durchschnittlich gefahrene Strecke?","options":{"A":"6 km","B":"7 km","C":"9 km","D":"8 km"},"answer":"D","explanation":"Durchschnitt aus vier Werten — 8 + 6 + 10 + 8 = 32, geteilt durch 4 Tage ergibt 8, also beträgt der Durchschnitt 8 km."},{"id":"q272","num":22,"subject":"mathematik","text":"Fünf Sonnenblumen sind unterschiedlich hoch (in cm): 20, 24, 18, 26, 22. Wie hoch ist die durchschnittliche Höhe?","options":{"A":"22 cm","B":"20 cm","C":"24 cm","D":"26 cm"},"answer":"A","explanation":"Durchschnitt aus fünf Werten — 20 + 24 + 18 + 26 + 22 = 110, geteilt durch 5 Pflanzen ergibt 22, also beträgt die Durchschnittshöhe 22 cm."},{"id":"q273","num":23,"subject":"mathematik","text":"An vier Tagen wurde folgende Regenmenge gemessen (in mm): 5, 9, 7, 11. Wie hoch war die durchschnittliche Regenmenge?","options":{"A":"6 mm","B":"7 mm","C":"8 mm","D":"9 mm"},"answer":"C","explanation":"Durchschnitt aus vier Messwerten — 5 + 9 + 7 + 11 = 32, geteilt durch 4 Tage ergibt 8, also betrug die durchschnittliche Regenmenge 8 mm."},{"id":"q274","num":24,"subject":"mathematik","text":"Drei Kinder haben folgende Anzahl an Murmeln gesammelt: 14, 20, 17. Wie hoch ist die durchschnittliche Anzahl an Murmeln?","options":{"A":"15 Murmeln","B":"16 Murmeln","C":"18 Murmeln","D":"17 Murmeln"},"answer":"D","explanation":"Durchschnitt aus drei Werten — 14 + 20 + 17 = 51, geteilt durch 3 Kinder ergibt 17, also beträgt der Durchschnitt 17 Murmeln."},{"id":"q275","num":25,"subject":"mathematik","text":"Sechs Schüler erreichten im Diktat folgende Punktzahlen: 7, 9, 8, 10, 8, 6. Wie hoch ist die durchschnittliche Punktzahl?","options":{"A":"7 Punkte","B":"9 Punkte","C":"8 Punkte","D":"10 Punkte"},"answer":"C","explanation":"Durchschnitt aus sechs Werten — 7 + 9 + 8 + 10 + 8 + 6 = 48, geteilt durch 6 Schüler ergibt 8, also beträgt der Durchschnitt 8 Punkte."},{"id":"q276","num":26,"subject":"mathematik","text":"Fünf Kartoffeln wiegen folgende Anzahl an Gramm: 150, 160, 140, 170, 130. Wie hoch ist das durchschnittliche Gewicht einer Kartoffel?","options":{"A":"140 Gramm","B":"150 Gramm","C":"160 Gramm","D":"145 Gramm"},"answer":"B","explanation":"Durchschnitt aus fünf Werten — 150 + 160 + 140 + 170 + 130 = 750, geteilt durch 5 Kartoffeln ergibt 150, also beträgt das Durchschnittsgewicht 150 Gramm."},{"id":"q277","num":27,"subject":"mathematik","text":"Ein Kind schläft an vier Nächten folgende Anzahl an Stunden: 9, 8, 10, 9. Wie hoch ist die durchschnittliche Schlafdauer?","options":{"A":"8 Stunden","B":"10 Stunden","C":"11 Stunden","D":"9 Stunden"},"answer":"D","explanation":"Durchschnitt aus vier Werten — 9 + 8 + 10 + 9 = 36, geteilt durch 4 Nächte ergibt 9, also beträgt die durchschnittliche Schlafdauer 9 Stunden."},{"id":"q278","num":28,"subject":"mathematik","text":"Eine Mannschaft erzielte in vier Spielen folgende Anzahl an Toren: 2, 4, 3, 3. Wie hoch ist die durchschnittliche Anzahl an Toren pro Spiel?","options":{"A":"2 Tore","B":"4 Tore","C":"5 Tore","D":"3 Tore"},"answer":"D","explanation":"Durchschnitt aus vier Werten — 2 + 4 + 3 + 3 = 12, geteilt durch 4 Spiele ergibt 3, also beträgt der Durchschnitt 3 Tore pro Spiel."},{"id":"q279","num":29,"subject":"mathematik","text":"Ein Kind hat in fünf Wochen folgende Anzahl an Euro gespart: 4, 6, 5, 5, 5. Wie hoch ist der durchschnittliche Sparbetrag pro Woche?","options":{"A":"5 Euro","B":"6 Euro","C":"4 Euro","D":"7 Euro"},"answer":"A","explanation":"Durchschnitt aus fünf Werten — 4 + 6 + 5 + 5 + 5 = 25, geteilt durch 5 Wochen ergibt 5, also beträgt der durchschnittliche Sparbetrag 5 Euro."},{"id":"q280","num":30,"subject":"mathematik","text":"Ein Kind ist in 6 Wochen insgesamt 42 km gejoggt, in jeder Woche ungefähr gleich viel. Wie viele Kilometer ist es im Durchschnitt pro Woche gejoggt?","options":{"A":"7 km","B":"6 km","C":"8 km","D":"9 km Wahrscheinlichkeit einschätzen (sicher, möglich, unmöglich, wahrscheinlicher / unwahrscheinlicher)"},"answer":"A","explanation":"Durchschnitt aus einer Gesamtsumme berechnen — 42 km geteilt durch 6 Wochen ergibt 7, also ist das Kind im Durchschnitt 7 km pro Woche gejoggt. Wahrscheinlichkeit einschätzen (sicher, möglich, unmöglich, wahrscheinlicher / unwahrscheinlicher)"},{"id":"q281","num":31,"subject":"mathematik","text":"Ein Glücksrad ist in 4 gleich große Felder geteilt: 2 grüne, 1 gelbes und 1 blaues Feld. Wie hoch ist die Wahrscheinlichkeit, mit einer Drehung Grün zu treffen?","options":{"A":"1/4","B":"1/3","C":"1/6","D":"1/2"},"answer":"D","explanation":"Wahrscheinlichkeit bei mehreren günstigen Feldern — 2 von 4 Feldern sind grün, also 2/4, was sich zu 1/2 kürzen lässt."},{"id":"q282","num":32,"subject":"mathematik","text":"In einem Beutel liegen 5 gelbe und 5 blaue Bausteine, insgesamt also 10 Bausteine. Wie hoch ist die Wahrscheinlichkeit, einen blauen Baustein zu ziehen?","options":{"A":"1/4","B":"1/2","C":"1/5","D":"1/10"},"answer":"B","explanation":"Wahrscheinlichkeit bei gleich vielen Bausteinen — 5 von 10 Bausteinen sind blau, also 5/10, was sich zu 1/2 kürzen lässt."},{"id":"q283","num":33,"subject":"mathematik","text":"Welches der folgenden Ereignisse ist sicher?","options":{"A":"Man würfelt mit einem normalen Würfel eine 9.","B":"Der Monat nach Januar ist der Februar.","C":"Es regnet morgen den ganzen Tag ununterbrochen.","D":"Man zieht aus einer Kiste mit nur roten Kugeln eine blaue Kugel."},"answer":"B","explanation":"Sicheres Ereignis erkennen — Auf den Januar folgt im Kalender immer der Februar, dieses Ereignis tritt also garantiert ein."},{"id":"q284","num":34,"subject":"mathematik","text":"Welches der folgenden Ereignisse ist unmöglich?","options":{"A":"Man würfelt mit einem normalen Würfel eine ungerade Zahl.","B":"Eine Münze zeigt beim Wurf Kopf.","C":"Man zieht aus einer Kiste mit nur grünen Kugeln eine rote Kugel.","D":"Ein Jahr hat 12 Monate."},"answer":"C","explanation":"Unmögliches Ereignis erkennen — Da in der Kiste ausschließlich grüne Kugeln liegen, kann niemals eine rote Kugel gezogen werden."},{"id":"q285","num":35,"subject":"mathematik","text":"In einer Kiste liegen 2 rote, 3 blaue und 5 gelbe Bauklötze, insgesamt also 10 Bauklötze. Wie hoch ist die Wahrscheinlichkeit, einen gelben Baustein zu ziehen (als Bruch)?","options":{"A":"1/5","B":"3/10","C":"1/10","D":"1/2"},"answer":"D","explanation":"Wahrscheinlichkeit als Bruch berechnen — 5 von 10 Bauklötzen sind gelb, also 5/10, was sich zu 1/2 kürzen lässt."},{"id":"q286","num":36,"subject":"mathematik","text":"Dieselbe Kiste (2 rote, 3 blaue, 5 gelbe Bauklötze, insgesamt 10): Wie hoch ist die Wahrscheinlichkeit, einen roten Baustein zu ziehen (als Bruch)?","options":{"A":"1/10","B":"3/10","C":"1/5","D":"1/2"},"answer":"C","explanation":"Wahrscheinlichkeit als Bruch berechnen — 2 von 10 Bauklötzen sind rot, also 2/10, was sich zu 1/5 kürzen lässt."},{"id":"q287","num":37,"subject":"mathematik","text":"Spinner 1 hat 1 von 5 gleich großen Feldern in Blau, Spinner 2 hat 3 von 5 gleich großen Feldern in Blau. Bei welchem Spinner ist es wahrscheinlicher, mit einer Drehung Blau zu treffen?","options":{"A":"Spinner 2","B":"Spinner 1","C":"Bei beiden gleich wahrscheinlich","D":"Bei keinem der beiden möglich"},"answer":"A","explanation":"Wahrscheinlichkeiten vergleichen — Spinner 2 hat mit 3 von 5 blauen Feldern einen größeren Anteil an Blau als Spinner 1 mit nur 1 von 5."},{"id":"q288","num":38,"subject":"mathematik","text":"In einer Urne liegen 8 Kugeln: 2 schwarze und 6 weiße. Wie wahrscheinlich ist es, beim Ziehen ohne Hinsehen eine weiße Kugel zu bekommen?","options":{"A":"unmöglich","B":"sehr unwahrscheinlich","C":"sehr wahrscheinlich","D":"genau gleich wahrscheinlich wie schwarz"},"answer":"C","explanation":"Wahrscheinlichkeit einschätzen — Da 6 von 8 Kugeln weiß sind, ist es sehr wahrscheinlich, eine weiße Kugel zu ziehen."},{"id":"q289","num":39,"subject":"mathematik","text":"Dieselbe Urne (2 schwarze, 6 weiße Kugeln, insgesamt 8): Wie hoch ist die Wahrscheinlichkeit, genau eine schwarze Kugel zu ziehen (als gekürzter Bruch)?","options":{"A":"1/4","B":"1/2","C":"3/4","D":"1/8"},"answer":"A","explanation":"Wahrscheinlichkeit als Bruch berechnen — 2 von 8 Kugeln sind schwarz, also 2/8, was sich zu 1/4 kürzen lässt."},{"id":"q290","num":40,"subject":"mathematik","text":"In einer Box liegen 7 orangefarbene, 2 lila und 1 türkise Kugel, insgesamt also 10 Kugeln. Welches Ereignis ist beim einmaligen Ziehen am wahrscheinlichsten?","options":{"A":"eine lila Kugel ziehen","B":"eine orangefarbene Kugel ziehen","C":"eine türkise Kugel ziehen","D":"eine lila oder türkise Kugel ziehen Zufallsexperimente (Würfel, Münze, Kombinatorik einfache Fälle)"},"answer":"B","explanation":"Wahrscheinlichstes Ereignis bestimmen — Mit 7 von 10 Kugeln ist die orangefarbene Kugel am häufigsten vertreten und daher am wahrscheinlichsten. Zufallsexperimente (Würfel, Münze, Kombinatorik einfache Fälle)"},{"id":"q291","num":41,"subject":"mathematik","text":"Ein Glücksrad hat 5 gleich große, nummerierte Felder (1 bis 5). Wie viele verschiedene Ergebnisse sind bei einer Drehung möglich?","options":{"A":"4 Ergebnisse","B":"5 Ergebnisse","C":"6 Ergebnisse","D":"3 Ergebnisse"},"answer":"B","explanation":"Anzahl möglicher Ergebnisse beim Glücksrad — Das Glücksrad hat 5 nummerierte Felder, also gibt es genau 5 mögliche Ergebnisse."},{"id":"q292","num":42,"subject":"mathematik","text":"Eine Münze wird zweimal hintereinander geworfen. Wie viele verschiedene Ergebnisfolgen sind möglich (KK, KZ, ZK, ZZ)?","options":{"A":"4 Folgen","B":"2 Folgen","C":"6 Folgen","D":"8 Folgen"},"answer":"A","explanation":"Ergebnisfolgen bei zwei Würfen — Bei jedem der 2 Würfe gibt es 2 Möglichkeiten, zusammen also 2 × 2 = 4 mögliche Folgen."},{"id":"q293","num":43,"subject":"mathematik","text":"Zwei Glücksräder mit je 6 gleich großen, nummerierten Feldern (1 bis 6) werden gleichzeitig gedreht. Wie viele mögliche Ergebnis-Kombinationen (erste Zahl, zweite Zahl) gibt es insgesamt?","options":{"A":"12 Kombinationen","B":"18 Kombinationen","C":"24 Kombinationen","D":"36 Kombinationen"},"answer":"D","explanation":"Kombinationen bei zwei Glücksrädern — Für jedes der 6 möglichen Ergebnisse des ersten Rads gibt es 6 mögliche Ergebnisse des zweiten Rads, zusammen 6 × 6 = 36 Kombinationen."},{"id":"q294","num":44,"subject":"mathematik","text":"In einer Schachtel liegen 4 verschiedenfarbige Perlen: rot, blau, grün und gelb. Auf wie viele verschiedene Arten können zwei davon nacheinander (ohne Zurücklegen) gezogen werden, wenn die Reihenfolge zählt?","options":{"A":"12 Arten","B":"16 Arten","C":"8 Arten","D":"6 Arten"},"answer":"A","explanation":"Geordnetes Ziehen ohne Zurücklegen — Für die erste Perle gibt es 4 Möglichkeiten, für die zweite noch 3, zusammen 4 × 3 = 12 Arten."},{"id":"q295","num":45,"subject":"mathematik","text":"Aus den Ziffern 2, 4 und 6 sollen zweistellige Zahlen gebildet werden, wobei keine Ziffer wiederholt werden darf (zum Beispiel 24, 42, ...). Wie viele verschiedene zweistellige Zahlen lassen sich so bilden?","options":{"A":"3 Zahlen","B":"4 Zahlen","C":"9 Zahlen","D":"6 Zahlen"},"answer":"D","explanation":"Zweistellige Zahlen ohne Wiederholung bilden — Für die erste Ziffer gibt es 3 Möglichkeiten, für die zweite noch 2, zusammen 3 × 2 = 6 Zahlen."},{"id":"q296","num":46,"subject":"mathematik","text":"Zwei Würfel werden gleichzeitig geworfen. Bei wie vielen der möglichen Kombinationen ergibt die Summe der beiden Zahlen genau 9 (zum Beispiel 3+6, 4+5, 5+4, 6+3)?","options":{"A":"3 Kombinationen","B":"6 Kombinationen","C":"4 Kombinationen","D":"5 Kombinationen"},"answer":"C","explanation":"Kombinationen mit bestimmter Summe zählen — Es gibt genau 4 Paare, deren Summe 9 ergibt: 3+6, 4+5, 5+4 und 6+3."},{"id":"q297","num":47,"subject":"mathematik","text":"Ein normaler Würfel wird einmal geworfen. Wie hoch ist die Wahrscheinlichkeit, eine Zahl größer als 4 zu würfeln (also 5 oder 6), als Bruch angegeben?","options":{"A":"1/2","B":"1/6","C":"2/3","D":"1/3"},"answer":"D","explanation":"Wahrscheinlichkeit für mehrere günstige Zahlen — 2 von 6 Zahlen (5 und 6) sind größer als 4, also 2/6, was sich zu 1/3 kürzen lässt."},{"id":"q298","num":48,"subject":"mathematik","text":"Eine Münze wird viermal hintereinander geworfen. Wie viele verschiedene Ergebnisfolgen sind insgesamt möglich?","options":{"A":"16 Folgen","B":"8 Folgen","C":"12 Folgen","D":"32 Folgen"},"answer":"A","explanation":"Ergebnisfolgen bei mehrfachem Werfen — Bei jedem der 4 Würfe gibt es 2 Möglichkeiten, zusammen also 2 × 2 × 2 × 2 = 16 mögliche Folgen."},{"id":"q299","num":49,"subject":"mathematik","text":"In einer Gruppe werden 3 Kinder zufällig in eine Startreihenfolge gebracht. Wie viele verschiedene Reihenfolgen der 3 Kinder sind möglich?","options":{"A":"6 Reihenfolgen","B":"9 Reihenfolgen","C":"3 Reihenfolgen","D":"12 Reihenfolgen"},"answer":"A","explanation":"Anzahl möglicher Reihenfolgen — Für den ersten Platz gibt es 3, dann 2 und 1 Möglichkeit, zusammen 3 × 2 × 1 = 6 Reihenfolgen."},{"id":"q300","num":50,"subject":"mathematik","text":"Ein Würfel wird zweimal hintereinander geworfen. Wie viele der 36 möglichen Kombinationen ergeben eine Summe von genau 4 (zum Beispiel 1+3, 2+2, 3+1)?","options":{"A":"2 Kombinationen","B":"4 Kombinationen","C":"3 Kombinationen","D":"5 Kombinationen"},"answer":"C","explanation":"Kombinationen mit bestimmter Summe zählen — Es gibt genau 3 Paare, deren Summe 4 ergibt: 1+3, 2+2 und 3+1."}]},{"testNum":17,"title":"Gemischter Test: Deutsch und Mathematik","subject":"gemischt","chapter":"Gemischter Test 1","kapitel":null,"type":"exam","questions":[{"id":"q301","num":1,"subject":"deutsch","text":"Nele bekam zum Schulanfang ein kleines Aquarium mit bunten Fischen geschenkt. Jeden Abend streut sie etwas Futter auf das Wasser und beobachtet, wie die Fische danach schnappen. Am Wochenende putzt ihr Vater gemeinsam mit ihr die Scheiben des Aquariums. Was bekam Nele zum Schulanfang geschenkt?","options":{"A":"einen Hamster","B":"ein Terrarium","C":"einen Wellensittich","D":"ein Aquarium mit Fischen"},"answer":"D","explanation":"Hauptinformation entnehmen — Der Text nennt direkt, dass Nele zum Schulanfang ein kleines Aquarium mit bunten Fischen geschenkt bekam."},{"id":"q302","num":2,"subject":"deutsch","text":"Ben übt seit den Sommerferien jeden Nachmittag auf dem Skateplatz in seiner Straße. Zuerst fiel er noch oft hin, doch mittlerweile schafft er schon kleine Sprünge. Seine Schwester filmt ihn manchmal mit dem Handy, damit er seine Tricks später ansehen kann. Was macht Bens Schwester laut Text manchmal?","options":{"A":"Sie übt selbst Skateboardfahren.","B":"Sie filmt ihn mit dem Handy.","C":"Sie repariert sein Skateboard.","D":"Sie bringt ihm Getränke."},"answer":"B","explanation":"Handlung im Text erfassen — Der Text beschreibt, dass Bens Schwester ihn manchmal mit dem Handy filmt, damit er seine Tricks später ansehen kann."},{"id":"q303","num":3,"subject":"deutsch","text":"Die Klasse 4b besuchte im Herbst einen Bauernhof am Stadtrand. Dort durften die Kinder zuerst Kartoffeln aus der Erde ausgraben und anschließend Äpfel vom Baum pflücken. Zum Abschluss bekam jedes Kind einen frisch gepressten Apfelsaft. Was durften die Kinder auf dem Bauernhof laut Text zuerst tun?","options":{"A":"Äpfel pflücken","B":"Apfelsaft trinken","C":"Kartoffeln ausgraben","D":"Tiere füttern"},"answer":"C","explanation":"Reihenfolge im Text erkennen — Der Text nennt als ersten Schritt, dass die Kinder Kartoffeln aus der Erde ausgraben durften."},{"id":"q304","num":4,"subject":"deutsch","text":"Für Annas Geburtstag war ein Fest im Garten geplant, denn der Wetterbericht hatte einen sonnigen Nachmittag vorhergesagt. Kurz vor Beginn zogen jedoch dichte Wolken auf, und ein heftiger Wind ließ die Luftballons davonfliegen. Deshalb verlegten Annas Eltern die Feier kurzerhand ins Wohnzimmer. Warum verlegten Annas Eltern die Feier ins Wohnzimmer?","options":{"A":"Das Wohnzimmer war größer als der Garten.","B":"Wolken und starker Wind machten die Gartenfeier unmöglich.","C":"Die Gäste wollten lieber drinnen feiern.","D":"Der Garten wurde neu bepflanzt."},"answer":"B","explanation":"Ursache erschließen — Obwohl Sonnenschein vorhergesagt war, zogen Wolken auf und starker Wind kam auf, sodass die Feier ins Wohnzimmer verlegt wurde."},{"id":"q305","num":5,"subject":"deutsch","text":"Im Freibad am Ortsrand bietet ein Verein jeden Samstagvormittag einen Schwimmkurs für Kinder an. Eine erfahrene Trainerin zeigt den Kindern zuerst die Beinbewegung des Kraulschwimmens, bevor sie ins Wasser dürfen. Nach dem Kurs gibt es für alle Teilnehmer einen kleinen Stempel im Schwimmpass. Wann findet der Schwimmkurs im Freibad statt?","options":{"A":"jeden Dienstagnachmittag","B":"jeden Sonntagmorgen","C":"jeden Freitagabend","D":"jeden Samstagvormittag"},"answer":"D","explanation":"Detail entnehmen — Der Text nennt ausdrücklich, dass der Schwimmkurs jeden Samstagvormittag stattfindet."},{"id":"q306","num":6,"subject":"deutsch","text":"In welchem Satz sind alle Wörter richtig groß- und kleingeschrieben?","options":{"A":"Im Herbst sammeln wir Kastanien im park.","B":"im Herbst sammeln wir Kastanien im Park.","C":"Im Herbst Sammeln wir Kastanien im Park.","D":"Im Herbst sammeln wir Kastanien im Park."},"answer":"D","explanation":"Groß- und Kleinschreibung — Nomen wie „Herbst“, „Kastanien“ und „Park“ werden großgeschrieben, das Verb „sammeln“ bleibt klein."},{"id":"q307","num":7,"subject":"deutsch","text":"In welchem Wort wird der kurze Vokal richtig durch einen Doppelkonsonanten gekennzeichnet?","options":{"A":"Hamer","B":"Haamer","C":"Hammer","D":"Hahmer"},"answer":"C","explanation":"Vokallänge kennzeichnen — Bei kurzem Vokal folgt oft ein doppelter Mitlaut, wie bei „Hammer“ mit doppeltem m."},{"id":"q308","num":8,"subject":"deutsch","text":"Welcher Satz ist richtig geschrieben?","options":{"A":"Ich glaube, dass es morgen regnet.","B":"Ich weiß, das du recht hast.","C":"Er meint, das wir zu spät kommen.","D":"Sie hofft, das er anruft."},"answer":"A","explanation":"das oder dass — Nach „glauben“ folgt die Konjunktion „dass“, da damit ein Nebensatz eingeleitet wird."},{"id":"q309","num":9,"subject":"deutsch","text":"In welchem Wort wird der s-Laut richtig geschrieben?","options":{"A":"Nuss","B":"Nuß","C":"Nus","D":"Nuhs"},"answer":"A","explanation":"s-Laute richtig schreiben — Nach einem kurzen Vokal steht „ss“, deshalb schreibt man „Nuss“ mit doppeltem s."},{"id":"q310","num":10,"subject":"deutsch","text":"In welchem Wort steht das scharfe s (ß) richtig, weil davor ein langer Vokal steht?","options":{"A":"Schuss","B":"Nuss","C":"Fuß","D":"Kuss"},"answer":"C","explanation":"ß nach langem Vokal — Nach einem langen Vokal oder Doppellaut steht „ß“, wie in „Fuß“."},{"id":"q311","num":11,"subject":"deutsch","text":"Welches Wort im folgenden Satz ist ein Nomen? „Der bunte Schmetterling fliegt über die Wiese.“","options":{"A":"Schmetterling","B":"bunte","C":"fliegt","D":"über"},"answer":"A","explanation":"Nomen erkennen — „Schmetterling“ ist ein Nomen, da es ein Lebewesen benennt und großgeschrieben wird."},{"id":"q312","num":12,"subject":"deutsch","text":"Welches Wort ist in diesem Satz ein Verb? „Die Kinder bauen eine hohe Sandburg am Strand.“","options":{"A":"Kinder","B":"hohe","C":"bauen","D":"Strand"},"answer":"C","explanation":"Verben erkennen — „Bauen“ ist das Verb im Satz, da es die Tätigkeit der Kinder beschreibt."},{"id":"q313","num":13,"subject":"deutsch","text":"Welches Wort ist in diesem Satz ein Adjektiv? „Der alte Leuchtturm steht einsam an der Küste.“","options":{"A":"Leuchtturm","B":"steht","C":"alte","D":"Küste"},"answer":"C","explanation":"Adjektive erkennen — „Alte“ beschreibt den Leuchtturm näher und ist deshalb ein Adjektiv."},{"id":"q314","num":14,"subject":"deutsch","text":"Welches Wort in diesem Satz ist ein Pronomen? „Er hat seinem Freund das Fahrrad geliehen.“","options":{"A":"Fahrrad","B":"Er","C":"geliehen","D":"Freund"},"answer":"B","explanation":"Pronomen erkennen — „Er“ ersetzt einen Namen und ist deshalb ein Pronomen."},{"id":"q315","num":15,"subject":"deutsch","text":"Welche Wortart hat das unterstrichene Wort? „Die Vögel singen morgens im Garten.“ (morgens)","options":{"A":"Nomen","B":"Adverb","C":"Verb","D":"Adjektiv"},"answer":"B","explanation":"Adverbien erkennen — „Morgens“ gibt an, wann etwas geschieht, und ist deshalb ein Adverb (Zeitangabe)."},{"id":"q316","num":16,"subject":"deutsch","text":"Welches Wort ist das Subjekt in diesem Satz? „Am Montag repariert der Elektriker die Lampe.“","options":{"A":"Am Montag","B":"die Lampe","C":"der Elektriker","D":"repariert"},"answer":"C","explanation":"Subjekt bestimmen — „Der Elektriker“ beantwortet die Frage „Wer repariert?“ und ist deshalb das Subjekt."},{"id":"q317","num":17,"subject":"deutsch","text":"Welches Wort ist das Prädikat in diesem Satz? „Die Kinder bauen im Sommer eine Sandburg.“","options":{"A":"bauen","B":"Kinder","C":"Sommer","D":"Sandburg"},"answer":"A","explanation":"Prädikat bestimmen — „Bauen“ ist die konjugierte Verbform des Satzes und bildet das Prädikat."},{"id":"q318","num":18,"subject":"deutsch","text":"Welches Satzglied ist im folgenden Satz das Akkusativobjekt? „Die Gärtnerin pflanzt bunte Blumen.“","options":{"A":"Die Gärtnerin","B":"pflanzt","C":"bunte Blumen","D":"Der Satz hat kein Akkusativobjekt."},"answer":"C","explanation":"Akkusativobjekt bestimmen — „Bunte Blumen“ beantwortet die Frage „Wen oder was pflanzt die Gärtnerin?“ und ist das Akkusativobjekt."},{"id":"q319","num":19,"subject":"deutsch","text":"Um welche Satzart handelt es sich? „Die Sonne scheint heute besonders hell.“","options":{"A":"Aussagesatz","B":"Aufforderungssatz","C":"Fragesatz","D":"Ausrufesatz"},"answer":"A","explanation":"Satzarten unterscheiden — Der Satz stellt eine Tatsache fest und ist deshalb ein Aussagesatz."},{"id":"q320","num":20,"subject":"deutsch","text":"Welcher Satz beginnt richtig mit einer Ortsangabe (Umstandsbestimmung)?","options":{"A":"Meine Schwester liest im Garten ein Buch.","B":"Ein Buch liest meine Schwester im Garten.","C":"Im Garten liest meine Schwester ein Buch.","D":"Liest meine Schwester im Garten ein Buch."},"answer":"C","explanation":"Satzglieder umstellen — Beginnt der Satz mit der Ortsangabe „Im Garten“, rückt das Verb „liest“ an die zweite Position."},{"id":"q321","num":21,"subject":"deutsch","text":"Welches Wort gehört nicht zum Wortfeld „gehen“?","options":{"A":"schreiten","B":"wandern","C":"singen","D":"spazieren"},"answer":"C","explanation":"Wortfelder unterscheiden — „Singen“ gehört zum Wortfeld „sagen/tönen“, nicht zum Wortfeld „gehen“."},{"id":"q322","num":22,"subject":"deutsch","text":"In welcher Zeitform steht der Satz? „Gestern besuchten wir unsere Großeltern.“","options":{"A":"Präsens","B":"Präteritum","C":"Futur I","D":"Perfekt"},"answer":"B","explanation":"Zeitformen erkennen — Die Form „besuchten“ ist die Präteritumform, die vergangenes Geschehen ausdrückt."},{"id":"q323","num":23,"subject":"deutsch","text":"Welches Wort passt sinnvoll in die Lücke? „Er nahm den Regenschirm mit, ___ es regnen könnte.“","options":{"A":"und","B":"aber","C":"sondern","D":"falls"},"answer":"D","explanation":"Konnektoren richtig einsetzen — „Falls“ leitet eine mögliche Bedingung ein: Er nahm den Schirm mit für den Fall, dass es regnet."},{"id":"q324","num":24,"subject":"deutsch","text":"Welcher Satz steht im Perfekt?","options":{"A":"Er malt ein Bild.","B":"Er malte ein Bild.","C":"Er hat ein Bild gemalt.","D":"Er wird ein Bild malen."},"answer":"C","explanation":"Perfekt erkennen — Das Perfekt wird mit „haben“ oder „sein“ und dem Partizip II gebildet, hier „hat gemalt“."},{"id":"q325","num":25,"subject":"deutsch","text":"Welches Wort verbindet die beiden Satzteile sinnvoll? „Sie ging früh ins Bett, ___ sie am nächsten Tag ausgeruht war.“","options":{"A":"weil","B":"damit","C":"obwohl","D":"denn"},"answer":"B","explanation":"Finalsätze mit „damit“ — „Damit“ leitet einen Zweck- bzw. Absichtssatz ein: Sie ging früh ins Bett mit dem Ziel, ausgeruht zu sein."},{"id":"q326","num":26,"subject":"mathematik","text":"Berechne schriftlich: 467.328 + 258.196 = ?","options":{"A":"715.524","B":"725.514","C":"735.524","D":"725.524"},"answer":"D","explanation":"Schriftliche Addition mit mehrfachem Übertrag — 467.328 + 258.196 = 725.524. Die Übertragsziffern müssen in mehreren Spalten sorgfältig berücksichtigt werden."},{"id":"q327","num":27,"subject":"mathematik","text":"Berechne schriftlich: 600.000 − 235.487 = ?","options":{"A":"365.513","B":"364.613","C":"364.513","D":"374.513"},"answer":"C","explanation":"Schriftliche Subtraktion mit Entbündeln — 600.000 − 235.487 = 364.513. Da viele Nullen entbündelt werden müssen, lohnt sich eine Überschlagsrechnung zur Kontrolle."},{"id":"q328","num":28,"subject":"mathematik","text":"Berechne schriftlich: 328 × 24 = ?","options":{"A":"7.872","B":"7.782","C":"7.972","D":"6.872"},"answer":"A","explanation":"Schriftliche Multiplikation über Teilprodukte — 328 × 24 = 328 × 20 + 328 × 4 = 6.560 + 1.312 = 7.872."},{"id":"q329","num":29,"subject":"mathematik","text":"Berechne schriftlich: 913 : 7 = ?","options":{"A":"130 Rest 0","B":"131 Rest 6","C":"129 Rest 10","D":"130 Rest 3"},"answer":"D","explanation":"Schriftliche Division mit Rest — 7 × 130 = 910, und 913 − 910 = 3. Das Ergebnis lautet also 130 Rest 3."},{"id":"q330","num":30,"subject":"mathematik","text":"Welche Ziffer steht in der Zahl 5.926.841 an der Hunderttausenderstelle?","options":{"A":"5","B":"2","C":"9","D":"6"},"answer":"C","explanation":"Stellenwerte im Millionenraum — In 5.926.841 steht die Ziffer 9 an der Hunderttausenderstelle, der zweiten Stelle von links."},{"id":"q331","num":31,"subject":"mathematik","text":"Mia kauft 4 Bücher zu je 3,50 € und 3 Lineale zu je 0,90 €. Wie viel bezahlt sie insgesamt?","options":{"A":"15,80 €","B":"17,60 €","C":"16,70 €","D":"14,90 €"},"answer":"C","explanation":"Mehrschrittige Einkaufsaufgabe — 4 × 3,50 € = 14,00 € und 3 × 0,90 € = 2,70 €. Zusammen ergibt das 14,00 € + 2,70 € = 16,70 €."},{"id":"q332","num":32,"subject":"mathematik","text":"Jonas hat 40,00 €. Er kauft ein Spiel für 22,30 € und eine Mütze für 9,20 €. Wie viel Geld hat er danach noch übrig?","options":{"A":"8,50 €","B":"9,50 €","C":"22,30 €","D":"9,20 €"},"answer":"A","explanation":"Restbetrag berechnen — 40,00 € − 22,30 € − 9,20 € = 8,50 €. Beide Ausgaben werden nacheinander vom Startbetrag abgezogen."},{"id":"q333","num":33,"subject":"mathematik","text":"Ein Auto fährt bei gleichbleibender Geschwindigkeit in 2 Stunden 150 km. Wie viele Kilometer legt es bei gleicher Geschwindigkeit in 7 Stunden zurück?","options":{"A":"450 km","B":"500 km","C":"510 km","D":"525 km"},"answer":"D","explanation":"Proportionale Zuordnung — 150 km : 2 Stunden = 75 km pro Stunde. In 7 Stunden legt das Auto also 7 × 75 km = 525 km zurück."},{"id":"q334","num":34,"subject":"mathematik","text":"204 Bonbons sollen gleichmäßig auf 17 Tüten verteilt werden. Wie viele Bonbons kommen in jede Tüte?","options":{"A":"12","B":"13","C":"14","D":"11"},"answer":"A","explanation":"Gleichmäßiges Verteilen — 204 : 17 = 12. Jede Tüte enthält also 12 Bonbons."},{"id":"q335","num":35,"subject":"mathematik","text":"Ein Klassenausflug kostet insgesamt 360 €. Die 24 Schülerinnen und Schüler zahlen jeweils 12 €. Wie viel Geld fehlt der Klasse noch, um die Kosten zu decken?","options":{"A":"56 €","B":"72 €","C":"84 €","D":"96 €"},"answer":"B","explanation":"Fehlbetrag berechnen — 24 × 12 € = 288 €. Da der Ausflug 360 € kostet, fehlen noch 360 € − 288 € = 72 €."},{"id":"q336","num":36,"subject":"mathematik","text":"Ein rechteckiges Handtuch ist 11 cm lang und 6 cm breit. Wie groß ist der Umfang des Rechtecks?","options":{"A":"30 cm","B":"17 cm","C":"66 cm","D":"34 cm"},"answer":"D","explanation":"Umfang eines Rechtecks — Der Umfang eines Rechtecks berechnet sich mit 2 × (Länge + Breite): 2 × (11 cm + 6 cm) = 34 cm."},{"id":"q337","num":37,"subject":"mathematik","text":"Ein rechteckiger Garten ist 12 m lang und 5 m breit. Wie groß ist die Fläche des Gartens?","options":{"A":"60 m²","B":"34 m²","C":"17 m²","D":"70 m²"},"answer":"A","explanation":"Flächeninhalt eines Rechtecks — Der Flächeninhalt eines Rechtecks berechnet sich mit Länge mal Breite: 12 m × 5 m = 60 m²."},{"id":"q338","num":38,"subject":"mathematik","text":"Ein quadratisches Tuch hat eine Seitenlänge von 9 cm. Wie groß ist sein Umfang?","options":{"A":"36 cm","B":"18 cm","C":"81 cm","D":"27 cm"},"answer":"A","explanation":"Umfang eines Quadrats — Der Umfang eines Quadrats berechnet sich mit 4 × Seitenlänge: 4 × 9 cm = 36 cm."},{"id":"q339","num":39,"subject":"mathematik","text":"Ein quadratisches Beet hat einen Flächeninhalt von 81 cm². Wie groß ist der Umfang dieses Beets?","options":{"A":"18 cm","B":"36 cm","C":"81 cm","D":"9 cm"},"answer":"B","explanation":"Vom Flächeninhalt zum Umfang — Da 9 × 9 = 81, beträgt die Seitenlänge 9 cm. Der Umfang ist 4 × 9 cm = 36 cm."},{"id":"q340","num":40,"subject":"mathematik","text":"Ein L-förmiger Garten entsteht, wenn aus einem Rechteck mit den Maßen 12 m mal 8 m eine rechteckige Ecke von 5 m mal 3 m herausgeschnitten wird. Wie groß ist die Fläche des L-förmigen Gartens?","options":{"A":"66 m²","B":"81 m²","C":"96 m²","D":"51 m²"},"answer":"B","explanation":"Flächeninhalt einer zusammengesetzten Figur — Die große Rechtecksfläche beträgt 12 m × 8 m = 96 m², die herausgeschnittene Ecke 5 m × 3 m = 15 m². 96 m² − 15 m² = 81 m²."},{"id":"q341","num":41,"subject":"mathematik","text":"Wie viele Ecken hat ein Würfel?","options":{"A":"6","B":"4","C":"12","D":"8"},"answer":"D","explanation":"Ecken eines Würfels — Ein Würfel besitzt acht Ecken, an denen jeweils drei Kanten zusammentreffen."},{"id":"q342","num":42,"subject":"mathematik","text":"Wie viele Kanten hat ein Quader?","options":{"A":"6","B":"8","C":"10","D":"12"},"answer":"D","explanation":"Kanten eines Quaders — Ein Quader besitzt zwölf Kanten, die jeweils zu Dreiergruppen gleich lang sind."},{"id":"q343","num":43,"subject":"mathematik","text":"Wie viele Symmetrieachsen besitzt ein Quadrat?","options":{"A":"2","B":"4","C":"1","D":"0"},"answer":"B","explanation":"Symmetrieachsen eines Quadrats — Ein Quadrat hat vier Symmetrieachsen: zwei durch die Seitenmitten und zwei durch die Diagonalen."},{"id":"q344","num":44,"subject":"mathematik","text":"Wie viele Flächen hat ein Quader?","options":{"A":"6","B":"8","C":"4","D":"12"},"answer":"A","explanation":"Flächen eines Quaders — Ein Quader besitzt sechs rechteckige Flächen, jeweils zwei davon sind zueinander deckungsgleich."},{"id":"q345","num":45,"subject":"mathematik","text":"Welche Beschreibung passt zu einem gültigen Netz eines Quaders?","options":{"A":"sechs Rechtecke, wahllos in einer Reihe ohne Bezug zueinander angeordnet","B":"sechs Rechtecke in drei gegenüberliegenden Paaren, die sich beim Falten ohne Überlappung zu einem geschlossenen Quader zusammenfügen","C":"vier Rechtecke und zwei Dreiecke","D":"sieben Rechtecke unterschiedlicher Größe"},"answer":"B","explanation":"Quadernetz erkennen — Ein gültiges Quadernetz besteht aus sechs Rechtecken in drei kongruenten Paaren, die sich beim Falten ohne Überlappung zu einem geschlossenen Quader zusammenfügen."},{"id":"q346","num":46,"subject":"mathematik","text":"An fünf Tagen wurden folgende Regenmengen gemessen (in mm): 8, 12, 5, 10, 15. Wie groß ist der Durchschnitt dieser fünf Werte?","options":{"A":"8 mm","B":"9 mm","C":"11 mm","D":"10 mm"},"answer":"D","explanation":"Durchschnitt berechnen — 8 + 12 + 5 + 10 + 15 = 50, und 50 : 5 = 10. Der Durchschnitt der fünf Regenmengen beträgt 10 mm."},{"id":"q347","num":47,"subject":"mathematik","text":"Mit welcher Wahrscheinlichkeit würfelt man mit einem normalen Würfel eine gerade Zahl?","options":{"A":"1/6","B":"1/3","C":"2/3","D":"1/2"},"answer":"D","explanation":"Wahrscheinlichkeit als Bruch — Gerade Zahlen sind 2, 4 und 6, also 3 von 6 möglichen Zahlen: 3/6, gekürzt 1/2."},{"id":"q348","num":48,"subject":"mathematik","text":"In einer Klasse wurden die Lieblingsgetränke erfragt: Wasser 9 Kinder, Saft 7 Kinder, Tee 11 Kinder, Kakao 5 Kinder. Wie viele Kinder wurden insgesamt befragt?","options":{"A":"30","B":"32","C":"34","D":"28"},"answer":"B","explanation":"Gesamtsumme aus einer Datenerhebung — 9 + 7 + 11 + 5 = 32. Insgesamt wurden 32 Kinder zu ihrem Lieblingsgetränk befragt."},{"id":"q349","num":49,"subject":"mathematik","text":"In einem Beutel liegen 4 rote, 6 gelbe und 2 schwarze Kugeln. Mit welcher Wahrscheinlichkeit zieht man blind eine gelbe Kugel?","options":{"A":"1/2","B":"1/3","C":"1/6","D":"1/4"},"answer":"A","explanation":"Wahrscheinlichkeit beim Ziehen — Von insgesamt 12 Kugeln sind 6 gelb, also beträgt die Wahrscheinlichkeit 6/12, gekürzt 1/2."},{"id":"q350","num":50,"subject":"mathematik","text":"Bei einer Strichliste zur Anzahl der Haustiere wurden folgende Werte notiert: 5, 7, 5, 3, 5, 2, 7. Welcher Wert kommt am häufigsten vor (Modus)?","options":{"A":"7","B":"3","C":"2","D":"5"},"answer":"D","explanation":"Modus bestimmen — Der Wert 5 kommt dreimal vor und damit häufiger als jeder andere Wert, er ist deshalb der Modus."}]},{"testNum":18,"title":"Gemischter Test: Deutsch und Mathematik","subject":"gemischt","chapter":"Gemischter Test 2","kapitel":null,"type":"exam","questions":[{"id":"q351","num":1,"subject":"deutsch","text":"Lies den Text und beantworte die Frage. „Sophie kümmert sich jeden Abend um ihren Hamster Felix. Sie füllt sein Wassernäpfchen auf und gibt ihm frisches Gemüse. Einmal in der Woche reinigt sie zusätzlich sein Gehege gründlich.“ Was macht Sophie jeden Abend für Felix?","options":{"A":"Sie putzt sein Gehege.","B":"Sie kauft ihm ein neues Spielzeug.","C":"Sie füllt sein Wasser auf und gibt ihm frisches Gemüse.","D":"Sie lässt ihn im Garten laufen."},"answer":"C","explanation":"Information entnehmen — Der Text nennt ausdrücklich das Auffüllen des Wassers und das Geben von frischem Gemüse als tägliche Aufgabe."},{"id":"q352","num":2,"subject":"deutsch","text":"Lies den Text und beantworte die Frage. „Am Samstag hilft Ben seinem Opa im Garten. Zuerst harken sie die Blätter zusammen, dann füllen sie sie in große Säcke. Am Ende gießen sie gemeinsam die Blumenbeete.“ Was tun Ben und sein Opa als Letztes?","options":{"A":"Sie harken Blätter zusammen.","B":"Sie füllen Säcke mit Blättern.","C":"Sie gießen die Blumenbeete.","D":"Sie pflanzen neue Blumen."},"answer":"C","explanation":"Reihenfolge erkennen — Der Text nennt das Gießen der Blumenbeete ausdrücklich als letzten Schritt."},{"id":"q353","num":3,"subject":"deutsch","text":"Lies den Text und beantworte die Frage. „In der Bäckerei duftet es nach frischem Brot. Frau Lehmann backt jeden Morgen um vier Uhr die ersten Brötchen. Um sechs Uhr öffnet sie den Laden für ihre Kunden.“ Um wie viel Uhr öffnet Frau Lehmann ihren Laden?","options":{"A":"Um vier Uhr","B":"Um fünf Uhr","C":"Um sieben Uhr","D":"Um sechs Uhr"},"answer":"D","explanation":"Information entnehmen — Der Text nennt sechs Uhr ausdrücklich als Öffnungszeit des Ladens."},{"id":"q354","num":4,"subject":"deutsch","text":"Lies den Text und beantworte die Frage. „Der kleine Kater Mio klettert gern auf den höchsten Baum im Garten. Eines Tages kommt er nicht mehr allein herunter. Sein Herrchen muss die Feuerwehr rufen, damit sie ihm hilft.“ Wie kommt Mio schließlich vom Baum herunter?","options":{"A":"Er springt allein herunter.","B":"Die Nachbarin holt eine Leiter.","C":"Er klettert von selbst wieder herunter.","D":"Die Feuerwehr hilft ihm herunter."},"answer":"D","explanation":"Lösung erkennen — Laut Text ruft das Herrchen die Feuerwehr, die Mio schließlich vom Baum herunterhilft."},{"id":"q355","num":5,"subject":"deutsch","text":"Lies den Text und beantworte die Frage. „Emma und ihre Schwester bauen am Strand eine große Sandburg. Zuerst formen sie den runden Turm, danach graben sie einen tiefen Graben drum herum. Am Ende stecken sie eine kleine Flagge oben auf die Burg.“ Was machen die Schwestern zuerst beim Bau der Sandburg?","options":{"A":"Sie graben einen Graben.","B":"Sie formen den runden Turm.","C":"Sie stecken die Flagge auf.","D":"Sie sammeln Muscheln."},"answer":"B","explanation":"Reihenfolge erkennen — Der Text nennt das Formen des runden Turms ausdrücklich als ersten Arbeitsschritt."},{"id":"q356","num":6,"subject":"deutsch","text":"Welches Wort ist richtig geschrieben?","options":{"A":"Schmeterling","B":"Schmetterlin","C":"Schmetterling","D":"Schmettderling"},"answer":"C","explanation":"Richtige Schreibweise — Nur „Schmetterling“ ist korrekt geschrieben, die anderen Formen enthalten Fehler bei Doppel-t oder fehlenden Buchstaben."},{"id":"q357","num":7,"subject":"deutsch","text":"In welchem Satz ist die Groß- und Kleinschreibung richtig?","options":{"A":"Im Winter fahren wir oft nach Österreich in den Skiurlaub.","B":"im winter fahren wir oft nach österreich in den Skiurlaub.","C":"Im Winter Fahren wir oft nach Österreich In den Skiurlaub.","D":"Im winter fahren Wir oft nach Österreich in den skiurlaub."},"answer":"A","explanation":"Groß- und Kleinschreibung — Satzanfang und Nomen (Winter, Österreich, Skiurlaub) werden großgeschrieben, alles andere klein."},{"id":"q358","num":8,"subject":"deutsch","text":"Welches Wort ist richtig geschrieben?","options":{"A":"Zal","B":"Zahll","C":"Tsahl","D":"Zahl"},"answer":"D","explanation":"Dehnungs-h — „Zahl“ wird mit Dehnungs-h geschrieben, das den langen a-Laut anzeigt."},{"id":"q359","num":9,"subject":"deutsch","text":"Welches Wort schreibt man mit ß und nicht mit ss?","options":{"A":"Nuss","B":"Straße","C":"Schluss","D":"Fluss"},"answer":"B","explanation":"s, ss oder ß — Nach einem langen Vokal steht ß, deshalb schreibt man „Straße“ mit ß, die anderen Wörter mit kurzem Vokal mit ss."},{"id":"q360","num":10,"subject":"deutsch","text":"In welchem Satz stehen die Kommas richtig?","options":{"A":"Der Vogel der auf dem Ast sitzt singt schön.","B":"Der Vogel, der auf dem Ast sitzt singt, schön.","C":"Der Vogel, der auf dem Ast sitzt, singt schön.","D":"Der Vogel der, auf dem Ast sitzt, singt schön."},"answer":"C","explanation":"Kommasetzung bei Relativsätzen — Der Relativsatz „der auf dem Ast sitzt“ wird vollständig mit Kommas eingeschlossen."},{"id":"q361","num":11,"subject":"deutsch","text":"Welches Wort in diesem Satz ist ein Nomen? „Der freche Hund jagt den roten Ball durch den Garten.“","options":{"A":"Hund","B":"jagt","C":"roten","D":"durch"},"answer":"A","explanation":"Nomen erkennen — „Hund“ benennt ein Lebewesen und ist damit ein Nomen; man erkennt es auch am Artikel „der“."},{"id":"q362","num":12,"subject":"deutsch","text":"Welches Wort ist in diesem Satz ein Adjektiv? „Die neugierige Maus entdeckt ein winziges Loch in der Wand.“","options":{"A":"Maus","B":"winziges","C":"entdeckt","D":"Wand"},"answer":"B","explanation":"Adjektiv erkennen — „winziges“ beschreibt eine Eigenschaft des Lochs und ist damit ein Adjektiv."},{"id":"q363","num":13,"subject":"deutsch","text":"Welches Wort ist ein Verb in diesem Satz? „Der Lehrer erklärt den Schülern die schwierige Aufgabe.“","options":{"A":"Lehrer","B":"Schülern","C":"schwierige","D":"erklärt"},"answer":"D","explanation":"Verb erkennen — „erklärt“ beschreibt eine Tätigkeit und ist damit das Verb des Satzes."},{"id":"q364","num":14,"subject":"deutsch","text":"Welches Wort ist ein Pronomen in diesem Satz? „Wir besuchen unsere Großeltern jedes Wochenende.“","options":{"A":"besuchen","B":"Großeltern","C":"Wir","D":"Wochenende"},"answer":"C","explanation":"Pronomen erkennen — „Wir“ steht anstelle von Namen und ist damit ein Personalpronomen."},{"id":"q365","num":15,"subject":"deutsch","text":"Welches Wort ist eine Präposition in diesem Satz? „Die Katze schläft unter dem warmen Ofen.“","options":{"A":"Katze","B":"schläft","C":"warmen","D":"unter"},"answer":"D","explanation":"Präposition erkennen — „unter“ gibt eine räumliche Beziehung an und ist damit eine Präposition."},{"id":"q366","num":16,"subject":"deutsch","text":"Bestimme das Subjekt in diesem Satz: „Am Abend liest die neugierige Schwester ein spannendes Buch.“","options":{"A":"die neugierige Schwester","B":"am Abend","C":"ein spannendes Buch","D":"liest"},"answer":"A","explanation":"Subjekt bestimmen — „die neugierige Schwester“ beantwortet die Frage „Wer liest?“ und ist damit das Subjekt."},{"id":"q367","num":17,"subject":"deutsch","text":"Bestimme das Prädikat in diesem Satz: „Der Bäcker backt am frühen Morgen frische Brötchen.“","options":{"A":"der Bäcker","B":"backt","C":"am frühen Morgen","D":"frische Brötchen"},"answer":"B","explanation":"Prädikat bestimmen — „backt“ ist die gebeugte Verbform und bildet das Prädikat des Satzes."},{"id":"q368","num":18,"subject":"deutsch","text":"Bestimme die Ortsangabe in diesem Satz: „Die Fische schwimmen am Morgen im klaren See.“","options":{"A":"die Fische","B":"am Morgen","C":"im klaren See","D":"schwimmen"},"answer":"C","explanation":"Ortsangabe erkennen — „im klaren See“ beantwortet die Frage „Wo?“ und ist damit die Ortsangabe."},{"id":"q369","num":19,"subject":"deutsch","text":"Welcher Satz ist ein Aussagesatz?","options":{"A":"Mach bitte das Fenster zu!","B":"Der Zug fährt pünktlich um acht Uhr ab.","C":"Kommst du heute mit?","D":"Wie laut die Musik ist!"},"answer":"B","explanation":"Satzarten unterscheiden — Ein Aussagesatz endet mit einem Punkt und teilt einen Sachverhalt mit, wie im zweiten Satz."},{"id":"q370","num":20,"subject":"deutsch","text":"Welcher Satz ist grammatikalisch richtig gebaut?","options":{"A":"Heute ich gehe schwimmen.","B":"Heute gehe ich schwimmen.","C":"Heute schwimmen ich gehe.","D":"Gehe heute ich schwimmen."},"answer":"B","explanation":"Satzbau prüfen — Nach dem vorangestellten Umstandswort „Heute“ steht das Verb an zweiter Stelle, dann das Subjekt."},{"id":"q371","num":21,"subject":"deutsch","text":"Welches Wort passt sinnvoll in die Lücke? „Paul hatte großen Hunger, ___ aß er ein großes Stück Brot.“","options":{"A":"deshalb","B":"obwohl","C":"trotzdem","D":"aber"},"answer":"A","explanation":"Kausale Verbindung — „deshalb“ zeigt, dass das Essen des Brotes eine Folge des Hungers ist."},{"id":"q372","num":22,"subject":"deutsch","text":"Welches Wort passt sinnvoll in die Lücke? „Die Sonne schien den ganzen Tag, ___ zog Anna eine dicke Jacke an.“","options":{"A":"weil","B":"deshalb","C":"denn","D":"trotzdem"},"answer":"D","explanation":"Gegensatz erkennen — „trotzdem“ drückt aus, dass Anna die Jacke trotz des sonnigen Wetters anzog."},{"id":"q373","num":23,"subject":"deutsch","text":"Welches Wort passt sinnvoll in die Lücke? „Tom übte jeden Tag Fußball, ___ er im nächsten Turnier gewinnen wollte.“","options":{"A":"dann","B":"weil","C":"aber","D":"trotzdem"},"answer":"B","explanation":"Begründung erkennen — „weil“ leitet den Grund für Toms tägliches Üben ein."},{"id":"q374","num":24,"subject":"deutsch","text":"Worauf bezieht sich das Wort „es“ in diesem Text? „Papa kaufte ein neues Handy. Es lag schon am Abend auf dem Tisch.“","options":{"A":"das Handy","B":"der Papa","C":"der Abend","D":"der Tisch"},"answer":"A","explanation":"Pronomenbezug — „es“ ersetzt das zuvor genannte Nomen „das Handy“."},{"id":"q375","num":25,"subject":"deutsch","text":"Worauf bezieht sich das Wort „ihn“ in diesem Text? „Tim verlor seinen Ball im Wald. Zum Glück fand ein Wanderer ihn und brachte ihn zurück.“","options":{"A":"den Wald","B":"den Ball","C":"den Wanderer","D":"das Glück"},"answer":"B","explanation":"Pronomenbezug — „ihn“ bezieht sich beide Male auf den zuvor genannten Ball."},{"id":"q376","num":26,"subject":"mathematik","text":"Berechne: 3 678 245 + 2 146 879 = ?","options":{"A":"3 815 124","B":"5 825 024","C":"5 825 124","D":"5 835 124"},"answer":"C","explanation":"Addition im Millionenraum — 3 678 245 + 2 146 879 = 5 825 124, schriftlich stellengerecht addiert."},{"id":"q377","num":27,"subject":"mathematik","text":"Berechne: 7 000 000 − 3 256 481 = ?","options":{"A":"3 733 519","B":"3 743 619","C":"3 753 519","D":"3 743 519"},"answer":"D","explanation":"Subtraktion im Millionenraum — 7 000 000 − 3 256 481 = 3 743 519, schriftlich mit Entbündeln gerechnet."},{"id":"q378","num":28,"subject":"mathematik","text":"Berechne: 347 × 68 = ?","options":{"A":"23 486","B":"23 696","C":"23 596","D":"22 596"},"answer":"C","explanation":"Schriftliche Multiplikation — 347 × 68 = 347 × 70 − 347 × 2 = 24 290 − 694 = 23 596."},{"id":"q379","num":29,"subject":"mathematik","text":"Berechne: 84 672 ÷ 16 = ?","options":{"A":"5 292","B":"5 282","C":"5 392","D":"5 229"},"answer":"A","explanation":"Schriftliche Division — 84 672 ÷ 16 = 5 292, die Division geht ohne Rest auf."},{"id":"q380","num":30,"subject":"mathematik","text":"Runde die Zahl 5 832 417 auf die nächsten Zehntausend.","options":{"A":"5 830 000","B":"5 840 000","C":"5 800 000","D":"5 900 000"},"answer":"A","explanation":"Runden großer Zahlen — Die Tausenderstelle (2) rundet ab, daher wird auf 5 830 000 gerundet."},{"id":"q381","num":31,"subject":"mathematik","text":"Ein Supermarkt verkauft an einem Tag drei Sorten Äpfel: 245 kg, 189 kg und 312 kg. Am nächsten Tag werden zusätzlich 97 kg verkauft. Wie viele Kilogramm Äpfel wurden insgesamt verkauft?","options":{"A":"833 kg","B":"853 kg","C":"813 kg","D":"843 kg"},"answer":"D","explanation":"Mehrschrittige Sachaufgabe — 245 kg + 189 kg + 312 kg + 97 kg = 843 kg."},{"id":"q382","num":32,"subject":"mathematik","text":"Eine Bäckerei backt täglich 336 Brötchen. Wie viele Brötchen backt sie in 18 Tagen?","options":{"A":"6 048","B":"6 058","C":"5 948","D":"6 148"},"answer":"A","explanation":"Multiplikative Sachaufgabe — 336 × 18 = 336 × 20 − 336 × 2 = 6 720 − 672 = 6 048 Brötchen."},{"id":"q383","num":33,"subject":"mathematik","text":"2 916 Stifte sollen gleichmäßig auf 27 Kisten verteilt werden. Wie viele Stifte kommen in jede Kiste?","options":{"A":"118","B":"98","C":"108","D":"128"},"answer":"C","explanation":"Verteilen durch Division — 2 916 ÷ 27 = 108 Stifte pro Kiste."},{"id":"q384","num":34,"subject":"mathematik","text":"Vier Freunde kaufen je ein Konzertticket für 32 Euro. Außerdem gibt jeder von ihnen 6 Euro für Getränke aus. Wie viel Geld geben die vier Freunde insgesamt aus?","options":{"A":"152 Euro","B":"142 Euro","C":"162 Euro","D":"172 Euro"},"answer":"A","explanation":"Sachaufgabe mit zwei Schritten — 4 × (32 Euro + 6 Euro) = 4 × 38 Euro = 152 Euro."},{"id":"q385","num":35,"subject":"mathematik","text":"Herr Fischer hat 250 Euro dabei. Er kauft vier Bücher zu je 19 Euro und einen Rucksack für 38 Euro. Wie viel Geld bleibt ihm übrig?","options":{"A":"126 Euro","B":"146 Euro","C":"116 Euro","D":"136 Euro"},"answer":"D","explanation":"Geld-Sachaufgabe — 250 Euro − (4 × 19 Euro + 38 Euro) = 250 Euro − 114 Euro = 136 Euro."},{"id":"q386","num":36,"subject":"mathematik","text":"Ein Rechteck ist 15 cm lang und 9 cm breit. Wie groß ist sein Umfang?","options":{"A":"44 cm","B":"108 cm","C":"48 cm","D":"24 cm"},"answer":"C","explanation":"Umfang eines Rechtecks — Umfang = 2 × (15 cm + 9 cm) = 2 × 24 cm = 48 cm."},{"id":"q387","num":37,"subject":"mathematik","text":"Ein Rechteck ist 13 cm lang und 7 cm breit. Wie groß ist sein Flächeninhalt?","options":{"A":"84 cm²","B":"91 cm²","C":"98 cm²","D":"71 cm²"},"answer":"B","explanation":"Flächeninhalt eines Rechtecks — Flächeninhalt = 13 cm × 7 cm = 91 cm²."},{"id":"q388","num":38,"subject":"mathematik","text":"Ein Quadrat hat eine Seitenlänge von 9,5 cm. Wie groß ist sein Umfang?","options":{"A":"19 cm","B":"36 cm","C":"40 cm","D":"38 cm"},"answer":"D","explanation":"Umfang eines Quadrats — Umfang = 4 × 9,5 cm = 38 cm."},{"id":"q389","num":39,"subject":"mathematik","text":"Ein Quadrat hat eine Seitenlänge von 14 cm. Wie groß ist sein Flächeninhalt?","options":{"A":"56 cm²","B":"196 cm²","C":"189 cm²","D":"216 cm²"},"answer":"B","explanation":"Flächeninhalt eines Quadrats — Flächeninhalt = 14 cm × 14 cm = 196 cm²."},{"id":"q390","num":40,"subject":"mathematik","text":"Ein Rechteck ist 16 cm lang und 6 cm breit, ein Quadrat hat eine Seitenlänge von 9 cm. Welche Aussage ist richtig?","options":{"A":"Das Rechteck hat den größeren Flächeninhalt.","B":"Das Quadrat hat den größeren Flächeninhalt.","C":"Beide Flächeninhalte sind gleich groß.","D":"Man kann es ohne Taschenrechner nicht berechnen."},"answer":"A","explanation":"Flächeninhalte vergleichen — Rechteck: 16 cm × 6 cm = 96 cm²; Quadrat: 9 cm × 9 cm = 81 cm². 96 cm² ist größer als 81 cm²."},{"id":"q391","num":41,"subject":"mathematik","text":"Wie viele Ecken hat ein Würfel?","options":{"A":"6","B":"8","C":"12","D":"4"},"answer":"B","explanation":"Ecken des Würfels — Ein Würfel besitzt 8 Ecken, an denen jeweils drei Kanten zusammentreffen."},{"id":"q392","num":42,"subject":"mathematik","text":"Wie viele Kanten hat ein dreiseitiges Prisma (Prisma mit dreieckiger Grundfläche)?","options":{"A":"6","B":"9","C":"12","D":"8"},"answer":"B","explanation":"Kanten des Prismas — Ein dreiseitiges Prisma hat zwei dreieckige Grundflächen mit je 3 Kanten sowie 3 senkrechte Kanten, insgesamt also 9 Kanten."},{"id":"q393","num":43,"subject":"mathematik","text":"Wie viele Ecken hat eine Pyramide mit fünfeckiger Grundfläche?","options":{"A":"6","B":"5","C":"7","D":"8"},"answer":"A","explanation":"Ecken der Pyramide — Fünf Ecken liegen auf der fünfeckigen Grundfläche, hinzu kommt die Spitze, also 6 Ecken."},{"id":"q394","num":44,"subject":"mathematik","text":"Wie viele Symmetrieachsen hat ein gleichseitiges Dreieck?","options":{"A":"1","B":"3","C":"2","D":"0"},"answer":"B","explanation":"Symmetrieachsen des Dreiecks — Ein gleichseitiges Dreieck hat 3 Symmetrieachsen, jeweils von einer Ecke zur Mitte der gegenüberliegenden Seite."},{"id":"q395","num":45,"subject":"mathematik","text":"Wie viele Symmetrieachsen hat ein Rechteck, das kein Quadrat ist?","options":{"A":"1","B":"4","C":"2","D":"0"},"answer":"C","explanation":"Symmetrieachsen des Rechtecks — Ein nicht-quadratisches Rechteck hat 2 Symmetrieachsen, die jeweils durch die Mitten gegenüberliegender Seiten verlaufen."},{"id":"q396","num":46,"subject":"mathematik","text":"Fünf Kinder erzielen bei einem Wettbewerb folgende Punktzahlen: 14, 18, 11, 20, 12. Wie hoch ist der Mittelwert (Durchschnitt) dieser Punktzahlen?","options":{"A":"14","B":"16","C":"15","D":"13"},"answer":"C","explanation":"Mittelwert berechnen — (14 + 18 + 11 + 20 + 12) ÷ 5 = 75 ÷ 5 = 15."},{"id":"q397","num":47,"subject":"mathematik","text":"Bei einer Umfrage nennen sieben Kinder ihre Lieblingszahl: 6, 2, 6, 9, 6, 4, 2. Welche Zahl ist der Modus, also die am häufigsten genannte Zahl?","options":{"A":"2","B":"9","C":"4","D":"6"},"answer":"D","explanation":"Modus bestimmen — Die Zahl 6 kommt dreimal vor und damit häufiger als jede andere Zahl."},{"id":"q398","num":48,"subject":"mathematik","text":"In einem Beutel liegen 5 rote, 4 blaue und 3 grüne Kugeln. Mit welch
