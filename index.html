er Wahrscheinlichkeit zieht man blind eine grüne Kugel?","options":{"A":"5/12","B":"4/12","C":"9/12","D":"3/12"},"answer":"D","explanation":"Wahrscheinlichkeit bestimmen — Von insgesamt 12 Kugeln sind 3 grün, die Wahrscheinlichkeit beträgt also 3/12."},{"id":"q399","num":49,"subject":"mathematik","text":"Fünf Kinder benötigen für einen Hindernislauf folgende Zeiten in Sekunden: 3, 15, 8, 21, 10. Wie lautet der Median (Zentralwert) dieser Werte?","options":{"A":"10","B":"8","C":"15","D":"12"},"answer":"A","explanation":"Median bestimmen — Der Größe nach geordnet lauten die Werte 3, 8, 10, 15, 21; der mittlere Wert ist 10."},{"id":"q400","num":50,"subject":"mathematik","text":"Beim Werfen eines gewöhnlichen Spielwürfels: Mit welcher Wahrscheinlichkeit erhält man eine Zahl kleiner als 3, also 1 oder 2?","options":{"A":"1/6","B":"3/6","C":"2/6","D":"4/6"},"answer":"C","explanation":"Wahrscheinlichkeit beim Würfeln — Von den 6 möglichen Zahlen sind 1 und 2 kleiner als 3, also 2 von 6 Möglichkeiten."}]},{"testNum":19,"title":"Gemischter Test: Deutsch und Mathematik","subject":"gemischt","chapter":"Gemischter Test 3","kapitel":null,"type":"exam","questions":[{"id":"q401","num":1,"subject":"deutsch","text":"Am Samstag besuchten Emma und ihr Bruder das Naturkundemuseum in der Stadt. Sie bestaunten dort ausgestellte Dinosaurierskelette und ein großes Aquarium mit bunten Fischen. Am liebsten mochte Emma jedoch den Saal mit den Mineralien. Was mochte Emma am liebsten im Museum?","options":{"A":"Die Dinosaurierskelette","B":"Den Saal mit den Mineralien","C":"Das Aquarium","D":"Den Museumsshop"},"answer":"B","explanation":"Detail erfassen — Der Text sagt ausdrücklich, dass Emma den Saal mit den Mineralien am liebsten mochte."},{"id":"q402","num":2,"subject":"deutsch","text":"Finn kam von der Schule nach Hause und suchte seinen Wohnungsschlüssel in seiner Tasche. Er konnte ihn nicht finden und wurde langsam nervös. Zum Glück erinnerte er sich, dass seine Nachbarin einen Ersatzschlüssel besaß. Wer besaß einen Ersatzschlüssel?","options":{"A":"Finns Mutter","B":"Die Nachbarin","C":"Der Hausmeister","D":"Finns bester Freund"},"answer":"B","explanation":"Detail erfassen — Laut Text erinnerte sich Finn, dass seine Nachbarin einen Ersatzschlüssel besaß."},{"id":"q403","num":3,"subject":"deutsch","text":"Die Klasse 4a wollte einen Ausflug in den Kletterwald machen. Wegen starken Regens musste der Ausflug jedoch verschoben werden. Stattdessen besuchte die Klasse den nahegelegenen botanischen Garten. Warum musste der Ausflug in den Kletterwald verschoben werden?","options":{"A":"weil der Bus kaputt war","B":"weil zu wenige Kinder mitkamen","C":"wegen starken Regens","D":"weil der Kletterwald geschlossen war"},"answer":"C","explanation":"Grund erschließen — Der Text nennt starken Regen ausdrücklich als Grund für die Verschiebung des Ausflugs."},{"id":"q404","num":4,"subject":"deutsch","text":"Sophie übte jeden Nachmittag Geige, weil in zwei Wochen ein Schulkonzert stattfand. Am Tag des Konzerts war sie zunächst aufgeregt, spielte aber am Ende fehlerfrei. Ihre Eltern waren sehr stolz auf sie. Wie spielte Sophie beim Konzert?","options":{"A":"Sie brach das Stück ab","B":"Sie spielte sehr leise","C":"Sie spielte fehlerfrei","D":"Sie vergaß ihre Noten"},"answer":"C","explanation":"Handlungsfolge — Laut Text spielte Sophie am Ende des Konzerts fehlerfrei, obwohl sie zunächst aufgeregt war."},{"id":"q405","num":5,"subject":"deutsch","text":"Familie Neumann zeltete am Wochenende an einem See. In der Nacht begann es heftig zu regnen, und das Zelt wurde undicht. Am nächsten Morgen packten sie ihre Sachen zusammen und fuhren zu den Großeltern. Wohin fuhr die Familie am nächsten Morgen?","options":{"A":"Zurück nach Hause","B":"Zu den Großeltern","C":"In ein Hotel","D":"Auf einen anderen Campingplatz"},"answer":"B","explanation":"Ort der Handlung — Der Text sagt, dass die Familie am nächsten Morgen zu den Großeltern fuhr."},{"id":"q406","num":6,"subject":"deutsch","text":"Welches Wort ist richtig geschrieben?","options":{"A":"Numer","B":"Nuhmer","C":"Nummer","D":"Nummar"},"answer":"C","explanation":"Doppelkonsonant — Richtig ist „Nummer“ mit doppeltem m."},{"id":"q407","num":7,"subject":"deutsch","text":"Welcher Satz ist richtig geschrieben?","options":{"A":"Nächsten freitag fahren wir nach Berlin.","B":"Nächsten Freitag fahren wir nach Berlin.","C":"nächsten Freitag Fahren wir nach Berlin.","D":"Nächsten Freitag fahren Wir nach berlin."},"answer":"B","explanation":"Groß- und Kleinschreibung — Satzanfang, Wochentag „Freitag“ und Stadtname „Berlin“ werden großgeschrieben, „fahren“ bleibt klein."},{"id":"q408","num":8,"subject":"deutsch","text":"Welcher Satz ist richtig geschrieben?","options":{"A":"Ich glaube, dass, er Recht hat.","B":"Ich glaube das er Recht hat.","C":"Ich glaube, das er Recht hat.","D":"Ich glaube, dass er Recht hat."},"answer":"D","explanation":"dass/das — Nach „glauben“ folgt die Konjunktion „dass“, davor steht ein Komma: „Ich glaube, dass er Recht hat.“"},{"id":"q409","num":9,"subject":"deutsch","text":"Welcher Satz ist richtig geschrieben?","options":{"A":"Seit ihr schon lange hier?","B":"Wir spielen seid einer Stunde Fußball.","C":"Seid ihr schon lange hier?","D":"Wir wohnen seid zwei Jahren hier."},"answer":"C","explanation":"seit/seid — „Seid“ ist hier die Form von „sein“; „Seid ihr schon lange hier?“ ist korrekt."},{"id":"q410","num":10,"subject":"deutsch","text":"Welches Wort passt in die Lücke: „Das verhält sich völlig ___ meiner Erwartung.“?","options":{"A":"Wieder","B":"wieder","C":"Wider","D":"wider"},"answer":"D","explanation":"wieder/wider — „Wider“ (klein geschrieben, bedeutet „gegen“) passt hier; „wieder“ bedeutet „erneut/zurück“."},{"id":"q411","num":11,"subject":"deutsch","text":"Welches Wort in diesem Satz ist ein Nomen: „Der laute Hund bellt im Garten.“?","options":{"A":"laute","B":"bellt","C":"im","D":"Hund"},"answer":"D","explanation":"Nomen erkennen — „Hund“ ist ein Nomen; es bezeichnet ein Lebewesen und wird großgeschrieben."},{"id":"q412","num":12,"subject":"deutsch","text":"Welches Wort in diesem Satz ist ein Verb: „Die Vögel singen fröhlich am Morgen.“?","options":{"A":"Vögel","B":"singen","C":"fröhlich","D":"Morgen"},"answer":"B","explanation":"Verb erkennen — „Singen“ ist die konjugierte Verbform und beschreibt die Tätigkeit der Vögel."},{"id":"q413","num":13,"subject":"deutsch","text":"Welches Wort in diesem Satz ist ein Adjektiv: „Der schwere Koffer steht neben der Tür.“?","options":{"A":"Koffer","B":"schwere","C":"steht","D":"Tür"},"answer":"B","explanation":"Adjektiv erkennen — „Schwere“ beschreibt die Eigenschaft des Koffers und ist somit ein Adjektiv."},{"id":"q414","num":14,"subject":"deutsch","text":"Welches Wort in diesem Satz ist ein Pronomen: „Er half seinem kleinen Bruder bei den Hausaufgaben.“?","options":{"A":"Er","B":"Bruder","C":"Hausaufgaben","D":"half"},"answer":"A","explanation":"Pronomen erkennen — „Er“ steht anstelle eines Namens und ist deshalb ein Personalpronomen."},{"id":"q415","num":15,"subject":"deutsch","text":"Welches Wort in diesem Satz ist eine Präposition: „Die Katze sitzt neben dem Fenster und schläft.“?","options":{"A":"neben","B":"Katze","C":"sitzt","D":"schläft"},"answer":"A","explanation":"Präposition erkennen — „Neben“ gibt eine Ortsbeziehung an und ist eine Präposition."},{"id":"q416","num":16,"subject":"deutsch","text":"Bestimme das Subjekt im Satz: „Am Nachmittag repariert der geschickte Handwerker das kaputte Fahrrad.“","options":{"A":"Am Nachmittag","B":"der geschickte Handwerker","C":"repariert","D":"das kaputte Fahrrad"},"answer":"B","explanation":"Subjekt bestimmen — Das Subjekt beantwortet die Frage „Wer oder was?“ — hier: der geschickte Handwerker."},{"id":"q417","num":17,"subject":"deutsch","text":"Bestimme das Prädikat im Satz: „Die Kinder singen jeden Morgen ein Lied im Kreis.“","options":{"A":"singen","B":"Die Kinder","C":"jeden Morgen","D":"ein Lied"},"answer":"A","explanation":"Prädikat bestimmen — Das Prädikat ist die konjugierte Verbform des Satzes: „singen“."},{"id":"q418","num":18,"subject":"deutsch","text":"Bestimme das Akkusativobjekt im Satz: „Die Bäckerin backt am frühen Morgen frisches Brot.“","options":{"A":"frisches Brot","B":"Die Bäckerin","C":"backt","D":"am frühen Morgen"},"answer":"A","explanation":"Akkusativobjekt bestimmen — Das Akkusativobjekt antwortet auf „Wen oder was?“ — hier: frisches Brot."},{"id":"q419","num":19,"subject":"deutsch","text":"Welcher Satzteil ist eine adverbiale Bestimmung des Ortes im Satz: „Die Kinder spielen nach der Schule im Park Fußball.“?","options":{"A":"nach der Schule","B":"Fußball","C":"im Park","D":"Die Kinder"},"answer":"C","explanation":"Adverbiale Bestimmung des Ortes — „Im Park“ gibt an, wo etwas geschieht, und ist eine Ortsangabe."},{"id":"q420","num":20,"subject":"deutsch","text":"Welcher Satz hat die richtige Wortstellung im Nebensatz?","options":{"A":"Ich bleibe zu Hause, weil bin ich krank.","B":"Ich bleibe zu Hause, weil ich krank bin.","C":"Ich bleibe zu Hause, weil ich bin krank.","D":"Ich bleibe zu Hause, weil krank ich bin."},"answer":"B","explanation":"Wortstellung im Nebensatz — Im Nebensatz mit „weil“ steht das konjugierte Verb am Satzende, wie in „…, weil ich krank bin.“"},{"id":"q421","num":21,"subject":"deutsch","text":"Ben hatte den ganzen Tag nichts gegessen. ___ hatte er großen Hunger. Welches Wort passt in die Lücke?","options":{"A":"Obwohl","B":"Trotzdem","C":"Außerdem","D":"Deshalb"},"answer":"D","explanation":"Kausaler Zusammenhang — „Deshalb“ drückt die Folge (großer Hunger) aus dem zuvor genannten Grund (nichts gegessen) aus."},{"id":"q422","num":22,"subject":"deutsch","text":"Es war sehr kalt draußen. ___ zogen die Kinder keine Jacken an. Welches Wort passt in die Lücke?","options":{"A":"Trotzdem","B":"Deshalb","C":"Weil","D":"Damit"},"answer":"A","explanation":"Konzessiver Zusammenhang — „Trotzdem“ zeigt einen Gegensatz: Obwohl es kalt war, zogen die Kinder keine Jacken an."},{"id":"q423","num":23,"subject":"deutsch","text":"Der Lehrer verteilte die Testblätter an die Klasse. ___ sollten die Namen sofort eintragen. Welches Wort ersetzt am besten „die Kinder der Klasse“?","options":{"A":"Es","B":"Ihm","C":"Ihr","D":"Sie"},"answer":"D","explanation":"Pronomen als Bezugswort — „Sie“ (Plural, 3. Person) ersetzt korrekt „die Kinder der Klasse“ als Bezugswort."},{"id":"q424","num":24,"subject":"deutsch","text":"Der Bus hatte Verspätung. ___ kamen die Schüler zu spät zum Unterricht. Welches Wort passt in die Lücke?","options":{"A":"Obwohl","B":"Trotzdem","C":"Bevor","D":"Deshalb"},"answer":"D","explanation":"Kausaler Zusammenhang — „Deshalb“ zeigt, dass die Verspätung des Busses die Ursache für das Zuspätkommen war."},{"id":"q425","num":25,"subject":"deutsch","text":"Welcher Satz schließt logisch an den folgenden Text an: „Dunkle Wolken zogen auf, und ein lauter Donner grollte in der Ferne.“?","options":{"A":"Die Sonne schien den ganzen Tag ohne Wolken.","B":"Die Kinder gingen barfuß an den Strand.","C":"Die Familie beeilte sich, um noch rechtzeitig ins Haus zu kommen.","D":"Es war ein ruhiger, klarer Sternenhimmel."},"answer":"C","explanation":"Logische Fortsetzung — Aufziehende Gewitterwolken und Donner passen logisch dazu, dass die Familie sich beeilt, ins Haus zu kommen."},{"id":"q426","num":26,"subject":"mathematik","text":"Runde die Zahl 5.647.320 auf die nächsten Zehntausend.","options":{"A":"5.640.000","B":"5.600.000","C":"5.650.000","D":"5.700.000"},"answer":"C","explanation":"Runden auf Zehntausend — Die Tausenderziffer (7) ist größer oder gleich 5, deshalb wird aufgerundet: 5.650.000."},{"id":"q427","num":27,"subject":"mathematik","text":"Berechne: 246.837 + 158.926 = ?","options":{"A":"404.763","B":"405.763","C":"406.763","D":"415.763"},"answer":"B","explanation":"Schriftliche Addition — 246.837 + 158.926 = 405.763 (schriftlich addieren, Überträge beachten)."},{"id":"q428","num":28,"subject":"mathematik","text":"Berechne: 412.500 − 186.750 = ?","options":{"A":"225.750","B":"226.750","C":"224.750","D":"235.750"},"answer":"A","explanation":"Schriftliche Subtraktion — 412.500 − 186.750 = 225.750 (schriftlich subtrahieren, Entbündeln beachten)."},{"id":"q429","num":29,"subject":"mathematik","text":"Berechne: 3.156 × 27 = ?","options":{"A":"84.212","B":"86.212","C":"85.212","D":"83.212"},"answer":"C","explanation":"Schriftliche Multiplikation — 3.156 × 27 = 85.212 (3.156 × 20 = 63.120, 3.156 × 7 = 22.092, Summe = 85.212)."},{"id":"q430","num":30,"subject":"mathematik","text":"Berechne: 96.408 : 24 = ?","options":{"A":"4.071","B":"4.170","C":"4.007","D":"4.017"},"answer":"D","explanation":"Schriftliche Division — 96.408 : 24 = 4.017, denn 4.017 × 24 = 96.408."},{"id":"q431","num":31,"subject":"mathematik","text":"In einer Bäckerei werden 6 Kisten mit je 36 Brötchen geliefert. Die Brötchen werden gleichmäßig auf 8 Körbe verteilt. Wie viele Brötchen sind in jedem Korb?","options":{"A":"24","B":"30","C":"27","D":"36"},"answer":"C","explanation":"Sachaufgabe mit zwei Schritten — 6 × 36 = 216 Brötchen insgesamt; 216 : 8 = 27 Brötchen pro Korb."},{"id":"q432","num":32,"subject":"mathematik","text":"Für eine Fahrt stehen 4 Busse mit je 52 Sitzplätzen bereit. Es nehmen 187 Personen teil. Wie viele Plätze bleiben frei?","options":{"A":"15","B":"25","C":"19","D":"21"},"answer":"D","explanation":"Sachaufgabe: freie Plätze — 4 × 52 = 208 Sitzplätze; 208 − 187 = 21 Plätze bleiben frei."},{"id":"q433","num":33,"subject":"mathematik","text":"Herr Meier kauft 5 Hefte zu je 2,80 €. Er bezahlt mit einem 20-€-Schein. Wie viel Wechselgeld erhält er?","options":{"A":"5,00 €","B":"5,50 €","C":"6,00 €","D":"6,50 €"},"answer":"C","explanation":"Sachaufgabe mit Geld — 5 × 2,80 € = 14,00 €; 20,00 € − 14,00 € = 6,00 € Wechselgeld."},{"id":"q434","num":34,"subject":"mathematik","text":"Ein Auto fährt mit gleichbleibender Geschwindigkeit 210 km in 3 Stunden. Wie weit kommt es bei gleicher Geschwindigkeit in 5 Stunden?","options":{"A":"300 km","B":"350 km","C":"320 km","D":"360 km"},"answer":"B","explanation":"Sachaufgabe: Geschwindigkeit — 210 km : 3 h = 70 km/h; 70 km/h × 5 h = 350 km."},{"id":"q435","num":35,"subject":"mathematik","text":"Ein Becken fasst 3.600 Liter. Ein Schlauch füllt 24 Liter pro Minute ein. Wie viele Minuten dauert es, bis das Becken voll ist?","options":{"A":"140 min","B":"150 min","C":"160 min","D":"130 min"},"answer":"B","explanation":"Sachaufgabe: Füllzeit — 3.600 : 24 = 150, also dauert es 150 Minuten, bis das Becken voll ist."},{"id":"q436","num":36,"subject":"mathematik","text":"Ein Rechteck ist 16 cm lang und 11 cm breit. Wie groß ist sein Umfang?","options":{"A":"27 cm","B":"176 cm","C":"54 cm","D":"58 cm"},"answer":"C","explanation":"Umfang eines Rechtecks — Umfang = 2 × (16 cm + 11 cm) = 2 × 27 cm = 54 cm."},{"id":"q437","num":37,"subject":"mathematik","text":"Ein Rechteck ist 13 cm lang und 6 cm breit. Wie groß ist sein Flächeninhalt?","options":{"A":"19 cm²","B":"78 cm²","C":"38 cm²","D":"68 cm²"},"answer":"B","explanation":"Flächeninhalt eines Rechtecks — Flächeninhalt = Länge × Breite = 13 cm × 6 cm = 78 cm²."},{"id":"q438","num":38,"subject":"mathematik","text":"Ein Quadrat hat eine Seitenlänge von 11 cm. Wie groß ist sein Umfang?","options":{"A":"22 cm","B":"40 cm","C":"44 cm","D":"48 cm"},"answer":"C","explanation":"Umfang eines Quadrats — Umfang = 4 × Seitenlänge = 4 × 11 cm = 44 cm."},{"id":"q439","num":39,"subject":"mathematik","text":"Ein Quadrat hat einen Umfang von 48 cm. Wie groß ist sein Flächeninhalt?","options":{"A":"48 cm²","B":"144 cm²","C":"96 cm²","D":"156 cm²"},"answer":"B","explanation":"Flächeninhalt aus Umfang — Seitenlänge = 48 cm : 4 = 12 cm; Flächeninhalt = 12 cm × 12 cm = 144 cm²."},{"id":"q440","num":40,"subject":"mathematik","text":"Ein Rechteck hat einen Flächeninhalt von 140 cm² und eine Seite von 10 cm. Wie groß ist sein Umfang?","options":{"A":"24 cm","B":"20 cm","C":"28 cm","D":"48 cm"},"answer":"D","explanation":"Umfang aus Flächeninhalt — Zweite Seite = 140 cm² : 10 cm = 14 cm; Umfang = 2 × (10 cm + 14 cm) = 48 cm."},{"id":"q441","num":41,"subject":"mathematik","text":"Wie viele Ecken (Eckpunkte) hat ein Würfel?","options":{"A":"8","B":"12","C":"6","D":"10"},"answer":"A","explanation":"Ecken des Würfels — Ein Würfel hat 8 Ecken, 12 Kanten und 6 Flächen."},{"id":"q442","num":42,"subject":"mathematik","text":"Wie viele Kanten hat ein Quader?","options":{"A":"6","B":"8","C":"12","D":"10"},"answer":"C","explanation":"Kanten des Quaders — Ein Quader hat wie der Würfel 12 Kanten, 8 Ecken und 6 Flächen."},{"id":"q443","num":43,"subject":"mathematik","text":"Wie viele Flächen hat ein Würfel?","options":{"A":"8","B":"10","C":"4","D":"6"},"answer":"D","explanation":"Flächen des Würfels — Ein Würfel hat 6 gleich große quadratische Flächen."},{"id":"q444","num":44,"subject":"mathematik","text":"Wie viele Symmetrieachsen hat ein Rechteck (kein Quadrat)?","options":{"A":"4","B":"1","C":"3","D":"2"},"answer":"D","explanation":"Symmetrieachsen des Rechtecks — Ein Rechteck hat 2 Symmetrieachsen: die beiden Mittelsenkrechten der Seiten."},{"id":"q445","num":45,"subject":"mathematik","text":"Wie viele Ecken hat eine quadratische Pyramide?","options":{"A":"5","B":"4","C":"6","D":"8"},"answer":"A","explanation":"Ecken der Pyramide — Eine quadratische Pyramide hat 4 Ecken an der Grundfläche und 1 Spitze, insgesamt 5 Ecken."},{"id":"q446","num":46,"subject":"mathematik","text":"In einer Umfrage in Klasse 4c wurden die Lieblingstiere erfasst: Hund 38 Stimmen, Katze 29 Stimmen, Pferd 21 Stimmen, Kaninchen 12 Stimmen. Wie viele Kinder wurden insgesamt befragt?","options":{"A":"100","B":"110","C":"90","D":"95"},"answer":"A","explanation":"Summe einer Datenreihe — 38 + 29 + 21 + 12 = 100 befragte Kinder insgesamt."},{"id":"q447","num":47,"subject":"mathematik","text":"Welches Tier wurde bei der Umfrage aus der vorherigen Aufgabe am häufigsten genannt?","options":{"A":"Katze","B":"Pferd","C":"Kaninchen","D":"Hund"},"answer":"D","explanation":"Häufigste Angabe (Modus) — Mit 38 Stimmen erhielt der Hund die meisten Nennungen und ist somit der häufigste Wert."},{"id":"q448","num":48,"subject":"mathematik","text":"Ein Würfel wird einmal geworfen. Wie groß ist die Wahrscheinlichkeit, eine Zahl größer als 4 zu würfeln?","options":{"A":"1/6","B":"1/2","C":"2/3","D":"1/3"},"answer":"D","explanation":"Wahrscheinlichkeit beim Würfeln — Größer als 4 sind die Zahlen 5 und 6, also 2 von 6 Möglichkeiten, das entspricht 1/3."},{"id":"q449","num":49,"subject":"mathematik","text":"Fünf Kinder erreichten in einem Test folgende Punktzahlen: 9, 3, 6, 10, 7. Wie hoch ist der Mittelwert dieser Punktzahlen?","options":{"A":"7","B":"6","C":"8","D":"5"},"answer":"A","explanation":"Mittelwert berechnen — Summe = 9+3+6+10+7 = 35; 35 : 5 = 7, also beträgt der Mittelwert 7."},{"id":"q450","num":50,"subject":"mathematik","text":"In einem Beutel liegen 4 gelbe, 6 grüne und 5 rote Kugeln. Mit welcher Wahrscheinlichkeit wird beim zufälligen Ziehen eine gelbe Kugel gezogen?","options":{"A":"4/15","B":"6/15","C":"5/15","D":"9/15"},"answer":"A","explanation":"Wahrscheinlichkeit beim Ziehen — Insgesamt liegen 15 Kugeln im Beutel, davon 4 gelbe, also beträgt die Wahrscheinlichkeit 4/15."}]},{"testNum":20,"title":"Abschlusstest: Deutsch und Mathematik","subject":"gemischt","chapter":"Abschlusstest","kapitel":null,"type":"exam","questions":[{"id":"q451","num":1,"subject":"deutsch","text":"Beim jährlichen Schulsportfest tritt die Klasse 4b im Staffellauf gegen die Parallelklasse an. Nach einem spannenden Wechsel der Staffelstäbe gewinnt die 4b nur um eine Zehntelsekunde. Die Kinder jubeln und bekommen eine goldene Urkunde. Um wie viel gewinnt die Klasse 4b laut Text den Staffellauf?","options":{"A":"nur um eine Zehntelsekunde","B":"um mehr als eine Minute","C":"sie verlieren den Wettlauf","D":"es gibt ein Unentschieden"},"answer":"A","explanation":"Zeitangabe im Text — Der Text nennt ausdrücklich, dass die 4b nur um eine Zehntelsekunde gewinnt."},{"id":"q452","num":2,"subject":"deutsch","text":"Bäckermeister Krause steht schon um vier Uhr morgens in seiner Backstube, um frische Brötchen zu backen. Besonders beliebt sind seine Zimtschnecken, die er jeden Samstag extra frisch zubereitet. Kunden stehen dafür manchmal schon vor Ladenöffnung Schlange. Was ist laut Text an Samstagen bei Bäcker Krause besonders beliebt?","options":{"A":"sein Roggenbrot","B":"seine Laugenbrezeln","C":"seine Zimtschnecken","D":"seine Käsekuchen"},"answer":"C","explanation":"Angebot der Bäckerei — Der Text nennt ausdrücklich die Zimtschnecken als samstägliche Besonderheit."},{"id":"q453","num":3,"subject":"deutsch","text":"Die Klasse 4a besucht das Planetarium in der Stadt. Dort können die Kinder in bequemen Sesseln liegen und den Sternenhimmel an der Kuppeldecke bestaunen. Ein Mitarbeiter erklärt dabei die Namen der Sternbilder. Wo liegen die Kinder laut Text, um den Sternenhimmel zu bestaunen?","options":{"A":"in bequemen Sesseln","B":"auf dem kalten Boden","C":"auf Bänken im Freien","D":"im Klassenzimmer am Pult"},"answer":"A","explanation":"Ort der Handlung — Laut Text liegen die Kinder in bequemen Sesseln, um die Kuppeldecke zu betrachten."},{"id":"q454","num":4,"subject":"deutsch","text":"Für ein Umweltprojekt sammelt die Klasse 4c einen Monat lang alte Pfandflaschen. Am Ende bringen die Kinder insgesamt 240 Flaschen zum Supermarkt zurück. Mit dem Pfandgeld kaufen sie neue Bücher für die Klassenbücherei. Was kauft die Klasse laut Text mit dem gesammelten Pfandgeld?","options":{"A":"neue Fußbälle","B":"neue Bücher für die Klassenbücherei","C":"einen Klassenausflug ins Kino","D":"neue Stifte für alle"},"answer":"B","explanation":"Verwendung des Geldes — Der Text sagt, dass die Klasse mit dem Pfandgeld neue Bücher für die Klassenbücherei kauft."},{"id":"q455","num":5,"subject":"deutsch","text":"Am Ende des Schuljahres veranstaltet die Musikschule ein großes Abschlusskonzert in der Stadthalle. Über hundert Kinder aus verschiedenen Instrumentengruppen treten gemeinsam auf. Nach dem letzten Stück gibt es donnernden Applaus vom Publikum. Wo findet laut Text das Abschlusskonzert der Musikschule statt?","options":{"A":"in der Schulturnhalle","B":"in der Stadthalle","C":"im Klassenzimmer","D":"auf dem Schulhof"},"answer":"B","explanation":"Veranstaltungsort — Der Text nennt ausdrücklich die Stadthalle als Ort des Abschlusskonzerts."},{"id":"q456","num":6,"subject":"deutsch","text":"Welches Wort ist richtig geschrieben?","options":{"A":"Schmetterling","B":"Schmeterling","C":"Schmettterling","D":"Schmetterlink"},"answer":"A","explanation":"Doppelkonsonant erkennen — Richtig ist „Schmetterling“ mit doppeltem t; die übrigen Schreibungen sind fehlerhaft."},{"id":"q457","num":7,"subject":"deutsch","text":"Welches Wort ist richtig geschrieben?","options":{"A":"Frühstük","B":"Frühstück","C":"Frühstueck","D":"Frühstueg"},"answer":"B","explanation":"ü-Schreibung — Richtig ist „Frühstück“ mit Umlaut ü und ck-Schreibung."},{"id":"q458","num":8,"subject":"deutsch","text":"In welchem Satz ist das unterstrichene Wort richtig geschrieben: „Die ___ schwimmen im Teich.“?","options":{"A":"Ändten","B":"Enten","C":"Ehnten","D":"Aenten"},"answer":"B","explanation":"Wortschreibung im Satz — Richtig ist „Enten“, einfach und ohne Dehnungs-h geschrieben."},{"id":"q459","num":9,"subject":"deutsch","text":"Welches Wort ist richtig geschrieben?","options":{"A":"Schwirigkeit","B":"Schwierigkeid","C":"Schwiirigkeit","D":"Schwierigkeit"},"answer":"D","explanation":"ie-Schreibung — Richtig ist „Schwierigkeit“ mit ie und stimmhaftem g am Wortende geschrieben als „- keit“."},{"id":"q460","num":10,"subject":"deutsch","text":"Welches Wort ist richtig geschrieben?","options":{"A":"Frülling","B":"Frühlin","C":"Frühlieng","D":"Frühling"},"answer":"D","explanation":"h-Schreibung — Richtig ist „Frühling“ mit Dehnungs-h nach ü."},{"id":"q461","num":11,"subject":"deutsch","text":"Welches Wort in diesem Satz ist ein Adjektiv? „Der bunte Drachen fliegt hoch am Himmel.“","options":{"A":"bunte","B":"Drachen","C":"fliegt","D":"Himmel"},"answer":"A","explanation":"Adjektiv erkennen — „Bunte“ beschreibt eine Eigenschaft des Drachens und ist somit ein Adjektiv."},{"id":"q462","num":12,"subject":"deutsch","text":"Welches Wort im folgenden Satz ist ein Verb? „Die Katze springt elegant über den Zaun.“","options":{"A":"Katze","B":"springt","C":"elegant","D":"Zaun"},"answer":"B","explanation":"Verb erkennen — „Springt“ ist die gebeugte Form des Verbs „springen“ und beschreibt die Tätigkeit."},{"id":"q463","num":13,"subject":"deutsch","text":"Welches Wort ist in diesem Satz ein Pronomen? „Wir besuchen unsere Großeltern am Wochenende.“","options":{"A":"besuchen","B":"Großeltern","C":"Wir","D":"Wochenende"},"answer":"C","explanation":"Pronomen erkennen — „Wir“ steht anstelle von Namen und ist deshalb ein Pronomen."},{"id":"q464","num":14,"subject":"deutsch","text":"Welches Wort ist in diesem Satz eine Präposition? „Der Ball liegt neben dem Baum.“","options":{"A":"Ball","B":"liegt","C":"Baum","D":"neben"},"answer":"D","explanation":"Präposition erkennen — „Neben“ gibt eine räumliche Beziehung an und ist somit eine Präposition."},{"id":"q465","num":15,"subject":"deutsch","text":"Welches Wort ist in diesem Satz ein Nomen? „Die Lehrerin schreibt die Aufgabe schnell an die Tafel.“","options":{"A":"Tafel","B":"schreibt","C":"schnell","D":"an"},"answer":"A","explanation":"Nomen erkennen — „Tafel“ bezeichnet einen Gegenstand, wird großgeschrieben und ist ein Nomen."},{"id":"q466","num":16,"subject":"deutsch","text":"Bestimme das Subjekt im folgenden Satz: „Nach der Schule spielt der kleine Hund im Hof.“","options":{"A":"Nach der Schule","B":"der kleine Hund","C":"im Hof","D":"spielt"},"answer":"B","explanation":"Subjekt bestimmen — „Der kleine Hund“ ist das Lebewesen, das handelt, und damit das Subjekt des Satzes."},{"id":"q467","num":17,"subject":"deutsch","text":"Bestimme das Prädikat im folgenden Satz: „Die Schüler lösen konzentriert die Matheaufgabe.“","options":{"A":"lösen","B":"Die Schüler","C":"konzentriert","D":"die Matheaufgabe"},"answer":"A","explanation":"Prädikat bestimmen — „Lösen“ ist die gebeugte Verbform und bildet das Prädikat des Satzes."},{"id":"q468","num":18,"subject":"deutsch","text":"Bestimme das Akkusativobjekt im folgenden Satz: „Die Mutter kauft ihrem Sohn ein neues Fahrrad.“","options":{"A":"ein neues Fahrrad","B":"Die Mutter","C":"ihrem Sohn","D":"kauft"},"answer":"A","explanation":"Akkusativobjekt bestimmen — „Ein neues Fahrrad“ steht im Akkusativ und beantwortet die Frage „wen oder was?“."},{"id":"q469","num":19,"subject":"deutsch","text":"Bestimme die Ortsangabe im folgenden Satz: „Die Fische schwimmen im Sommer im klaren See.“","options":{"A":"Die Fische","B":"schwimmen","C":"im Sommer","D":"im klaren See"},"answer":"D","explanation":"Ortsangabe bestimmen — „Im klaren See“ beantwortet die Frage „wo?“ und ist damit die Ortsangabe."},{"id":"q470","num":20,"subject":"deutsch","text":"Welcher der folgenden Sätze ist ein Ausrufesatz?","options":{"A":"Wie herrlich das Feuerwerk leuchtet!","B":"Das Feuerwerk beginnt um neun Uhr.","C":"Beginnt das Feuerwerk pünktlich?","D":"Wir sahen gestern ein tolles Feuerwerk."},"answer":"A","explanation":"Satzarten unterscheiden — Nur der erste Satz drückt mit Ausrufezeichen eine starke Empfindung aus — er ist ein Ausrufesatz."},{"id":"q471","num":21,"subject":"deutsch","text":"Welches Wort passt sinnvoll in die Lücke? „Tom hatte seine Hausaufgaben vergessen, ___ musste er nachsitzen.“","options":{"A":"obwohl","B":"bevor","C":"deshalb","D":"während"},"answer":"C","explanation":"Kausalen Zusammenhang erkennen — „Deshalb“ drückt die Folge des Vergessens aus und passt logisch in die Lücke."},{"id":"q472","num":22,"subject":"deutsch","text":"Worauf bezieht sich das Wort „er“ im folgenden Satz? „Opa nahm seinen Hut ab, weil er schwitzte.“","options":{"A":"Opa","B":"den Hut","C":"die Sonne","D":"es ist unklar"},"answer":"A","explanation":"Pronomenbezug erkennen — „Er“ bezieht sich auf Opa, da er es ist, der schwitzt."},{"id":"q473","num":23,"subject":"deutsch","text":"Welcher Satz passt logisch als Fortsetzung von: „Sara hatte ihren Wecker nicht gehört.“?","options":{"A":"Deshalb war sie viel zu früh in der Schule.","B":"Sie hatte schon drei Wecker im Zimmer.","C":"Sie kam an diesem Morgen zu spät zur Schule.","D":"Sie kaufte sich einen neuen Fahrradhelm."},"answer":"C","explanation":"Logische Textfortsetzung — Da Sara den Wecker nicht hörte, folgt logisch, dass sie zu spät zur Schule kam."},{"id":"q474","num":24,"subject":"deutsch","text":"Welches Bindewort passt sinnvoll in die Lücke? „Es war schon spät, ___ ging Jonas schnell ins Bett.“","options":{"A":"deshalb","B":"obwohl","C":"während","D":"bevor"},"answer":"A","explanation":"Bindewörter richtig einsetzen — „Deshalb“ drückt die Folge der späten Uhrzeit aus und passt logisch in die Lücke."},{"id":"q475","num":25,"subject":"deutsch","text":"Welcher Satz passt nicht zu den anderen Sätzen über einen Ausflug ins Schwimmbad?","options":{"A":"Die Kinder sprangen vom Beckenrand ins Wasser.","B":"Am Abend reparierte Opa den kaputten Zaun im Garten.","C":"Im Planschbecken spielten die kleinen Kinder.","D":"An der Kasse kauften wir Eintrittskarten fürs Schwimmbad."},"answer":"B","explanation":"Thematischen Bruch erkennen — Der Satz über die Zaunreparatur passt inhaltlich nicht zum Thema Schwimmbadbesuch."},{"id":"q476","num":26,"subject":"mathematik","text":"Welche Zahl entspricht 5 Millionen, 302 Tausend und 18 Einern?","options":{"A":"5.320.018","B":"5.302.018","C":"5.032.018","D":"5.302.180"},"answer":"B","explanation":"Zahl aus Stellenwerten bilden — 5 Millionen + 302 Tausend + 18 Einer ergibt 5.302.018 (bash- verifiziert)."},{"id":"q477","num":27,"subject":"mathematik","text":"Rundet man die Zahl 4.753.829 auf die nächsten Zehntausend, erhält man:","options":{"A":"4.750.000","B":"4.760.000","C":"4.700.000","D":"4.753.000"},"answer":"A","explanation":"Runden auf Zehntausend — 4.753.829 liegt näher an 4.750.000 als an 4.760.000 (bash-verifiziert)."},{"id":"q478","num":28,"subject":"mathematik","text":"Wie groß ist die Summe aus 2.678.945 und 1.345.678?","options":{"A":"4.024.623","B":"4.014.623","C":"4.124.623","D":"4.034.623"},"answer":"A","explanation":"Addition im Millionenraum — 2.678.945 + 1.345.678 = 4.024.623 (bash-verifiziert)."},{"id":"q479","num":29,"subject":"mathematik","text":"Wie groß ist die Differenz aus 6.000.000 und 2.483.769?","options":{"A":"3.616.231","B":"3.516.231","C":"3.506.231","D":"3.526.231"},"answer":"B","explanation":"Subtraktion im Millionenraum — 6.000.000 − 2.483.769 = 3.516.231 (bash-verifiziert)."},{"id":"q480","num":30,"subject":"mathematik","text":"Wie groß ist das Ergebnis von 216.000 : 18?","options":{"A":"1.200","B":"21.600","C":"120.000","D":"12.000"},"answer":"D","explanation":"Division großer Zahlen — 216.000 : 18 = 12.000 (bash-verifiziert)."},{"id":"q481","num":31,"subject":"mathematik","text":"Bei einer Klassenfahrt zahlen 28 Kinder je 4 Euro und 22 Erwachsene je 7 Euro Eintritt. Wie hoch sind die gesamten Einnahmen?","options":{"A":"258 Euro","B":"276 Euro","C":"246 Euro","D":"266 Euro"},"answer":"D","explanation":"Gesamteinnahmen berechnen — 28 × 4 € + 22 × 7 € = 112 € + 154 € = 266 € (bash-verifiziert)."},{"id":"q482","num":32,"subject":"mathematik","text":"429 Bleistifte sollen in Neunerpackungen verpackt werden. Wie viele Packungen werden mindestens benötigt, damit kein Bleistift übrig bleibt?","options":{"A":"46 Packungen","B":"47 Packungen","C":"48 Packungen","D":"49 Packungen"},"answer":"C","explanation":"Aufrunden bei Verpackungsaufgaben — 429 : 9 = 47 Rest 6, daher wird eine weitere Packung benötigt: 48 Packungen (bash-verifiziert)."},{"id":"q483","num":33,"subject":"mathematik","text":"Ein Zug fährt um 7:20 Uhr ab. Die Fahrt dauert 2 Stunden und 50 Minuten. Um wie viel Uhr kommt der Zug an?","options":{"A":"9:10 Uhr","B":"10:00 Uhr","C":"9:50 Uhr","D":"10:10 Uhr"},"answer":"D","explanation":"Zeitspannen berechnen — 7:20 Uhr + 2 Stunden 50 Minuten = 10:10 Uhr (bash-verifiziert)."},{"id":"q484","num":34,"subject":"mathematik","text":"Ein Buch kostet 32,85 Euro. Wie viel Wechselgeld bekommt man, wenn man mit einem 50-Euro-Schein bezahlt?","options":{"A":"17,25 Euro","B":"17,15 Euro","C":"18,15 Euro","D":"16,15 Euro"},"answer":"B","explanation":"Wechselgeld berechnen — 50,00 € − 32,85 € = 17,15 € (bash-verifiziert)."},{"id":"q485","num":35,"subject":"mathematik","text":"4,25 kg Kirschen kosten 3,60 Euro pro Kilogramm. Wie viel kosten die Kirschen insgesamt?","options":{"A":"14,30 Euro","B":"15,90 Euro","C":"14,90 Euro","D":"15,30 Euro"},"answer":"D","explanation":"Gesamtpreis berechnen — 4,25 kg × 3,60 €/kg = 15,30 € (bash-verifiziert)."},{"id":"q486","num":36,"subject":"mathematik","text":"Ein Rechteck ist 15 cm lang und 9 cm breit. Wie groß ist sein Umfang?","options":{"A":"42 cm","B":"54 cm","C":"46 cm","D":"48 cm"},"answer":"D","explanation":"Rechteckumfang berechnen — U = 2 × (15 cm + 9 cm) = 48 cm (bash-verifiziert)."},{"id":"q487","num":37,"subject":"mathematik","text":"Ein Rechteck ist 13 cm lang und 7 cm breit. Wie groß ist sein Flächeninhalt?","options":{"A":"91 cm²","B":"84 cm²","C":"98 cm²","D":"20 cm²"},"answer":"A","explanation":"Rechteckfläche berechnen — A = 13 cm × 7 cm = 91 cm² (bash-verifiziert)."},{"id":"q488","num":38,"subject":"mathematik","text":"Ein Quadrat hat eine Seitenlänge von 17 cm. Wie groß ist sein Umfang?","options":{"A":"34 cm","B":"72 cm","C":"68 cm","D":"289 cm"},"answer":"C","explanation":"Quadratumfang berechnen — U = 4 × 17 cm = 68 cm (bash-verifiziert)."},{"id":"q489","num":39,"subject":"mathematik","text":"Ein Quadrat hat eine Seitenlänge von 11 cm. Wie groß ist sein Flächeninhalt?","options":{"A":"44 cm²","B":"110 cm²","C":"121 cm²","D":"132 cm²"},"answer":"C","explanation":"Quadratfläche berechnen — A = 11 cm × 11 cm = 121 cm² (bash-verifiziert)."},{"id":"q490","num":40,"subject":"mathematik","text":"Ein Rechteck hat einen Flächeninhalt von 108 cm² und eine Seite von 9 cm. Wie lang ist die andere Seite?","options":{"A":"10 cm","B":"12 cm","C":"14 cm","D":"16 cm"},"answer":"B","explanation":"Fehlende Seite berechnen — 108 cm² : 9 cm = 12 cm (bash-verifiziert)."},{"id":"q491","num":41,"subject":"mathematik","text":"Ein Körper besitzt 8 Ecken, 12 Kanten und 6 gleich große quadratische Flächen. Um welchen Körper handelt es sich?","options":{"A":"Quader","B":"Kugel","C":"Würfel","D":"Pyramide"},"answer":"C","explanation":"Körper anhand von Eigenschaften bestimmen — Nur der Würfel hat 8 Ecken, 12 Kanten und 6 kongruente quadratische Flächen."},{"id":"q492","num":42,"subject":"mathematik","text":"Wie viele Quadrate benötigt man mindestens, um ein vollständiges Würfelnetz zusammenzusetzen?","options":{"A":"4","B":"6","C":"8","D":"5"},"answer":"B","explanation":"Würfelnetz zusammensetzen — Ein Würfel hat sechs Flächen, daher besteht sein Netz aus sechs gleich großen Quadraten."},{"id":"q493","num":43,"subject":"mathematik","text":"Welches der folgenden Vierecke hat genau vier Symmetrieachsen?","options":{"A":"Rechteck","B":"Raute","C":"Parallelogramm","D":"Quadrat"},"answer":"D","explanation":"Vierecke nach Symmetrieachsen unterscheiden — Nur das Quadrat besitzt vier Symmetrieachsen (zwei Diagonalen und zwei Mittelsenkrechte); Rechteck und Raute haben je nur zwei."},{"id":"q494","num":44,"subject":"mathematik","text":"Ein Quader hat sechs rechteckige Flächen und acht Ecken. Wie viele Kanten besitzt er?","options":{"A":"6","B":"12","C":"8","D":"10"},"answer":"B","explanation":"Kantenzahl aus Flächen und Ecken ableiten — Ein Quader besitzt 12 Kanten; das passt zu 6 Flächen und 8 Ecken (Eulerscher Polyedersatz: E + F − K = 2)."},{"id":"q495","num":45,"subject":"mathematik","text":"Welche der folgenden ebenen Figuren hat genau drei Symmetrieachsen?","options":{"A":"Quadrat","B":"gleichschenkliges Dreieck","C":"Rechteck","D":"gleichseitiges Dreieck"},"answer":"D","explanation":"Figuren nach Symmetrieachsen unterscheiden — Nur das gleichseitige Dreieck besitzt drei Symmetrieachsen; das gleichschenklige Dreieck hat nur eine."},{"id":"q496","num":46,"subject":"mathematik","text":"Fünf Kinder haben folgende Punktzahlen erreicht: 22, 19, 25, 17, 27. Wie groß ist der Durchschnitt (das arithmetische Mittel)?","options":{"A":"20","B":"21","C":"23","D":"22"},"answer":"D","explanation":"Durchschnitt berechnen — (22+19+25+17+27) : 5 = 110 : 5 = 22 (bash-verifiziert)."},{"id":"q497","num":47,"subject":"mathematik","text":"Mit welcher Wahrscheinlichkeit würfelt man bei einem einzigen Wurf mit einem normalen Spielwürfel eine Zahl kleiner als 3 (also 1 oder 2)?","options":{"A":"1/6","B":"1/2","C":"1/3","D":"2/3"},"answer":"C","explanation":"Wahrscheinlichkeit beim Würfeln — Zwei von sechs gleich wahrscheinlichen Seiten (1 und 2) sind kleiner als 3, also 2/6 = 1/3 (bash-verifiziert)."},{"id":"q498","num":48,"subject":"mathematik","text":"In einer Umfrage wurden folgende Zahlen notiert: 6, 9, 6, 4, 6, 2, 9. Welche Zahl ist der Modus (häufigster Wert)?","options":{"A":"9","B":"4","C":"2","D":"6"},"answer":"D","explanation":"Modus bestimmen — Die Zahl 6 kommt dreimal vor und damit häufiger als jede andere Zahl (bash- verifiziert)."},{"id":"q499","num":49,"subject":"mathematik","text":"In einer Urne liegen 6 rote, 4 blaue und 2 grüne Kugeln. Mit welcher Wahrscheinlichkeit zieht man blind eine grüne Kugel?","options":{"A":"6/12","B":"4/12","C":"2/12","D":"8/12"},"answer":"C","explanation":"Wahrscheinlichkeit beim Ziehen — Insgesamt liegen 12 Kugeln in der Urne, davon 2 grüne, also beträgt die Wahrscheinlichkeit 2/12 (bash-verifiziert)."},{"id":"q500","num":50,"subject":"mathematik","text":"Bestimme den Median der folgenden Datenreihe: 8, 3, 11, 5, 9.","options":{"A":"5","B":"9","C":"8","D":"11"},"answer":"C","explanation":"Median bestimmen — Der Größe nach geordnet lautet die Reihe 3, 5, 8, 9, 11 — der mittlere Wert ist 8 (bash-verifiziert)."}]}],"passages":[{"passageNum":1,"title":"Lampenfieber","text":"Seit vier Wochen übte Lara jeden Nachmittag ihren Text für die Schulaufführung „Der mutige Ritter“, in der sie die Hauptrolle der Prinzessin spielen sollte. Je näher der Abend der Aufführung rückte, desto unruhiger wurde ihr Bauch. Am Tag der Vorstellung saß die ganze Familie im Publikum, sogar ihre Großeltern waren extra mit dem Zug angereist. Kurz bevor der Vorhang aufging, stand Lara hinter der Bühne und zitterte so stark, dass ihre beste Freundin Mia ihr die Hand drückte und flüsterte, alles werde gut gehen. Als der Vorhang sich öffnete und die Scheinwerfer aufleuchteten, vergaß Lara für einen Moment ihren ersten Satz. Doch dann erinnerte sie sich an Mias Worte, atmete tief durch und begann zu sprechen. Ihre Stimme wurde von Satz zu Satz sicherer. Am Ende der Vorstellung klatschte das Publikum lange, und Lara verbeugte sich strahlend, stolz darauf, ihre Angst überwunden zu haben."},{"passageNum":2,"title":"Der Mond","text":"Der Mond ist der einzige natürliche Trabant der Erde und umkreist sie in einer Entfernung von durchschnittlich etwa 384.000 Kilometern. Im Unterschied zur Sonne besitzt der Mond kein eigenes Licht, sondern spiegelt lediglich das Sonnenlicht zurück zur Erde. Je nachdem, wie Sonne, Erde und Mond zueinander stehen, erscheint uns der Mond unterschiedlich beleuchtet. Diese wechselnden Ansichten nennt man Mondphasen: Bei Neumond ist der Mond von der Erde aus fast unsichtbar, bei Vollmond dagegen erscheint seine gesamte sichtbare Seite hell erleuchtet. Ein vollständiger Zyklus von einem Vollmond zum nächsten dauert etwa 29,5 Tage. Auf der Mondoberfläche befinden sich zahlreiche Krater, die größtenteils vor Milliarden von Jahren durch Einschläge von Gesteinsbrocken aus dem Weltall entstanden sind. Da der Mond fast keine Atmosphäre besitzt, die Meteoriten abbremsen könnte, bleiben diese Krater über extrem lange Zeiträume nahezu unverändert erhalten. 1969 betrat mit Neil Armstrong der erste Mensch die Mondoberfläche."},{"passageNum":3,"title":"Der eitle Pfau und der bescheidene Spatz","text":"Im Park einer alten Stadt lebte ein Pfau, der stolz auf sein prächtiges, buntes Federkleid war. Jeden Morgen stellte er sich vor die anderen Tiere und breitete sein Rad aus, damit alle seine Schönheit bewundern konnten. „Niemand im ganzen Park ist so prächtig wie ich“, rief er oft laut. Ein kleiner grauer Spatz, der in der Hecke neben dem Teich wohnte, hörte diese Worte jeden Tag, sagte aber nie etwas dazu. Eines Nachts zog ein heftiges Gewitter über den Park, und starker Regen durchnässte alle Tiere. Der Pfau, dessen prächtige Federn schwer vom Wasser wurden, konnte kaum noch fliegen und blieb zitternd unter einem Baum stehen. Der kleine Spatz dagegen, dessen leichtes graues Gefieder das Wasser besser abwies, flog mühelos zu einem trockenen Unterschlupf unter dem Dach eines Gartenhauses. Am nächsten Morgen bot der Spatz dem Pfau einen Platz in seinem Unterschlupf an. Von diesem Tag an prahlte der Pfau nicht mehr mit seiner Schönheit, sondern bedankte sich freundlich bei seinem neuen Freund."},{"passageNum":4,"title":"Mein Tag auf dem Bauernhof","text":"Am letzten Ferientag durfte ich meine Tante Sabine besuchen, die zusammen mit meinem Onkel einen kleinen Bauernhof am Rand des Dorfes betreibt. Schon früh um sechs Uhr weckte mich das laute Krähen des Hahns, und ich half meinem Onkel dabei, die Hühner zu füttern. Danach zeigte mir Tante Sabine den Kuhstall, in dem zwölf Kühe lebten, und ich durfte zum ersten Mal in meinem Leben versuchen, eine Kuh von Hand zu melken. Es war viel schwieriger, als ich gedacht hatte, und meine Tante musste mir mehrmals zeigen, wie ich die Hände richtig bewegen sollte. Am Nachmittag brachte mich mein Onkel auf das große Feld hinter dem Hof, wo wir gemeinsam Kartoffeln aus der Erde gruben. Meine Hände waren am Abend voller Erde, aber ich war stolz auf den vollen Korb, den ich gefüllt hatte. Zum Abschluss des Tages durfte ich die frisch gemolkene Milch probieren, die noch warm war und ganz anders schmeckte als die Milch aus dem Supermarkt. Müde, aber glücklich, fuhr ich am Abend mit meinen Eltern wieder nach Hause."},{"passageNum":5,"title":"Zugvögel","text":"Jedes Jahr im Herbst brechen viele Vogelarten in Europa zu einer weiten Reise auf, die man Vogelzug nennt. Sie fliegen in wärmere Regionen, meist nach Afrika oder in den Süden Europas, weil dort im Winter mehr Nahrung wie Insekten und Früchte zu finden ist als in der kalten Jahreszeit in Mitteleuropa. Manche Vogelarten, etwa Störche oder Schwalben, legen dabei Strecken von mehreren tausend Kilometern zurück. Erstaunlicherweise finden viele Zugvögel ihren Weg, obwohl sie ihn zuvor noch nie geflogen sind. Wissenschaftler vermuten, dass sich Zugvögel unter anderem am Stand der Sonne, an Sternbildern und sogar am Magnetfeld der Erde orientieren können. Vor dem Abflug fressen sich viele Vögel zusätzliche Fettreserven an, die ihnen als Energiespeicher für die anstrengende Reise dienen. Während des Fluges legen manche Vogelschwärme, etwa Kraniche, regelmäßige Rastpausen an geeigneten Feuchtgebieten ein, um sich auszuruhen und neue Kräfte zu sammeln. Im Frühjahr kehren die meisten Zugvögel dann wieder in ihre angestammten Brutgebiete in Mitteleuropa zurück, um dort ihre Jungen großzuziehen."}]}</script>

<script>
(function(){
"use strict";

/* ===================== DATA ===================== */
var DATA = JSON.parse(document.getElementById('quiz-data').textContent);
var PASSAGES = {};
DATA.passages.forEach(function(p){ PASSAGES[p.passageNum] = p; });

var TOPIC_TESTS = { deutsch:[11,12,13], mathematik:[14,15,16] };

var TESTS_BY_NUM = {};
DATA.tests.forEach(function(t){ TESTS_BY_NUM[t.testNum] = t; });

var ALL_QUESTIONS = [];
DATA.tests.forEach(function(t){ t.questions.forEach(function(q){ ALL_QUESTIONS.push(q); }); });
var QUESTIONS_BY_ID = {};
ALL_QUESTIONS.forEach(function(q){ QUESTIONS_BY_ID[q.id] = q; });

var CHAPTER_META = {
  11:{icon:'\u{1F4D6}', color:'var(--amber)', name:'Leseverst\u00e4ndnis', subject:'deutsch'},
  12:{icon:'\u270F\uFE0F', color:'var(--amber)', name:'Rechtschreibung', subject:'deutsch'},
  13:{icon:'\u{1F4AC}', color:'var(--amber)', name:'Sprachgebrauch', subject:'deutsch'},
  14:{icon:'\u{1F522}', color:'var(--teal)', name:'Zahlen & Operationen', subject:'mathematik'},
  15:{icon:'\u{1F4D0}', color:'var(--teal)', name:'Raum & Form', subject:'mathematik'},
  16:{icon:'\u{1F4CA}', color:'var(--teal)', name:'Daten & Zufall', subject:'mathematik'}
};

/* ===================== PROGRESS (session + import/export, no localStorage) ===================== */
function freshProgress(){
  return {
    version:1,
    profileName:'Entdecker',
    createdAt:new Date().toISOString(),
    lastSession:null,
    history:[],
    mistakeBank:{},
    masteredCount:0,
    badges:[],
    leaderboard:[],
    settings:{fontSize:'m', dyslexic:false, dark:false, sound:true, speak:false}
  };
}
var PROGRESS = freshProgress();

function saveIndicator(){
  var el = document.getElementById('save-indicator');
  if(!el) return;
  el.style.opacity = '1';
  setTimeout(function(){ if(el) el.style.opacity = '0'; }, 1200);
}

/* ===================== APP STATE ===================== */
var App = {};
var state = {
  screen:'landing',
  quiz:null // active quiz session object
};

/* ===================== UTIL ===================== */
function el(html){ var d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':' + (s<10?'0':'')+s;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seed){
  var rnd = mulberry32(seed);
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(rnd()*(i+1));
    var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}
function shuffle(arr){ return seededShuffle(arr, Math.floor(Math.random()*1e9)); }
function dateSeedToday(){
  var d = new Date();
  var s = d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
  return s;
}
function pct(n,d){ return d===0 ? 0 : Math.round((n/d)*100); }

function render(html){
  document.getElementById('app').innerHTML = html;
  window.scrollTo(0,0);
}
function applySettingsToDom(){
  document.documentElement.setAttribute('data-theme', PROGRESS.settings.dark ? 'dark':'light');
  document.documentElement.setAttribute('data-dyslexic', PROGRESS.settings.dyslexic ? 'true':'false');
  var scale = {s:0.9, m:1, l:1.15, xl:1.3}[PROGRESS.settings.fontSize] || 1;
  document.documentElement.style.setProperty('--font-scale', scale);
}

/* ===================== ICONS (inline svg strings) ===================== */
var ICO = {
  gear:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"></path></svg>',
  user:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>',
  back:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>',
  speak:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M15.5 8.5a5 5 0 010 7"></path><path d="M18.5 5.5a9 9 0 010 13"></path></svg>',
  check:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>',
  x:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg>'
};

/* ===================== TOP BAR ===================== */
function topbar(title, showBack, backFn){
  return '<div class="topbar">' +
    (showBack ?
      '<button class="icon-btn" aria-label="Zur\u00fcck" onclick="'+backFn+'">'+ICO.back+'</button>' :
      '<div class="brand"><svg class="brand-mark" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="var(--navy)" stroke-width="2.4"/><circle cx="20" cy="20" r="2.6" fill="var(--amber)"/><path d="M20 6 L23 20 L20 34 L17 20 Z" fill="var(--navy)" opacity="0.85"/></svg>' +
        '<div><div class="brand-text">Kompass 4</div><div class="brand-sub">'+esc(title||'\u00dcbungs-App')+'</div></div></div>'
    ) +
    '<div class="topbar-actions">' +
      '<button class="icon-btn" aria-label="Profil" onclick="App.go(\'profile\')">'+ICO.user+'</button>' +
      '<button class="icon-btn" aria-label="Einstellungen" onclick="App.go(\'settings\')">'+ICO.gear+'</button>' +
    '</div></div>' +
    '<div id="save-indicator" style="position:fixed;top:8px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;font-size:0.72rem;padding:4px 12px;border-radius:999px;opacity:0;transition:opacity .3s;z-index:80;pointer-events:none;">Gespeichert im Profil</div>';
}

/* ===================== STATS HELPERS ===================== */
function overallStats(){
  var answered=0, correct=0;
  PROGRESS.history.forEach(function(h){ answered+=h.total; correct+=h.score; });
  var streak = 0;
  for(var i=PROGRESS.history.length-1;i>=0;i--){
    if(PROGRESS.history[i].score/PROGRESS.history[i].total >= 0.6) streak++; else break;
  }
  return {answered:answered, correct:correct, accuracy:pct(correct,answered), streak:streak, sessions:PROGRESS.history.length};
}
function chapterAccuracy(testNum){
  var seen=0, correct=0;
  PROGRESS.history.forEach(function(h){
    if(h.chapterStats && h.chapterStats[testNum]){
      seen += h.chapterStats[testNum].total;
      correct += h.chapterStats[testNum].correct;
    }
  });
  return {seen:seen, correct:correct, pct: pct(correct,seen)};
}

/* ===================== LANDING (COMPASS) ===================== */
function screenLanding(){
  var s = overallStats();
  var mistakeCount = Object.keys(PROGRESS.mistakeBank).length;
  var html = topbar('\u00dcbungs-App', false);

  html += '<div class="compass-wrap">' + compassSvg() + '<div class="compass-caption">Tippe auf eine Himmelsrichtung, um deine \u00dcbung zu w\u00e4hlen.</div></div>';

  html += '<div class="stats-strip">' +
    statBox(s.answered,'Beantwortet') +
    statBox(s.accuracy+'%','Erfolgsquote') +
    statBox(s.streak,'Serie \u{1F525}') +
    statBox(PROGRESS.badges.length,'Abzeichen') +
    '</div>';

  if(mistakeCount>0){
    html += '<div class="banner">\u26A0\uFE0F Du hast <strong>'+mistakeCount+'</strong> Fragen im Fehlerspeicher. <button class="btn btn-sm btn-ghost" style="margin-left:auto;white-space:nowrap;" onclick="App.go(\'mistakes\')">\u00dcben</button></div>';
  }

  html += '<div class="section"><div class="section-title">\u{1F4CD} Schnellzugriff</div><div class="tile-grid">';
  html += quickTile('\u2600\uFE0F','var(--gold)','Tagesaufgabe','10 gemischte Fragen \u2014 heute neu', "App.startDaily()");
  html += quickTile('\u{1F3C1}','var(--clay)','Pr\u00fcfungsmodus','4 Pr\u00fcfungen \u00e0 50 Fragen, mit Timer', "App.go('examSelect')");
  html += quickTile('\u{1F3AF}','var(--navy)','\u00dcbungsmodus','Nach Thema \u00fcben, mit Erkl\u00e4rung', "App.go('topicSelect')");
  html += '</div></div>';

  html += '<div class="footer-note">Kompass 4 \u00b7 Klasse-4-Vorbereitung \u00b7 Baden-W\u00fcrttemberg</div>';
  return html;
}
function statBox(num,label){
  return '<div class="stat-box"><div class="stat-num">'+num+'</div><div class="stat-label">'+label+'</div></div>';
}
function quickTile(icon,color,title,sub,onclick){
  return '<button class="tile" onclick="'+onclick+'">' +
    '<div class="tile-icon" style="background:'+color+';">'+icon+'</div>' +
    '<div class="tile-body"><div class="tile-title">'+title+'</div><div class="tile-sub">'+sub+'</div></div>' +
    '<div class="tile-chevron">\u203A</div></button>';
}
function compassSvg(){
  return '<svg class="compass-svg" viewBox="0 0 380 340" role="group" aria-label="Kompass-Navigation">' +
    '<circle cx="190" cy="170" r="150" fill="var(--paper-raised)" stroke="var(--line)" stroke-width="2"/>' +
    '<circle cx="190" cy="170" r="128" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 6"/>' +
    tickMarks() +
    // North = Mathematik
    dirGroup(190,60,'N','Mathematik','var(--teal)',"App.startTopic('mathematik')") +
    // South = Deutsch
    dirGroup(190,280,'S','Deutsch','var(--amber)',"App.startTopic('deutsch')") +
    // East (Osten) = Pruefung
    dirGroup(300,170,'O','Pr\u00fcfung','var(--clay)',"App.go('examSelect')") +
    // West = Fehlerspeicher
    dirGroup(80,170,'W','Fehler \u00fcben','var(--navy)',"App.go('mistakes')") +
    '<g class="compass-needle">' +
      '<path d="M190 100 L200 170 L190 240 L180 170 Z" fill="var(--navy)" opacity="0.18"/>' +
      '<path d="M190 105 L197 170 L190 175 L183 170 Z" fill="var(--clay)"/>' +
      '<path d="M190 235 L197 170 L190 165 L183 170 Z" fill="var(--ink-soft)"/>' +
    '</g>' +
    '<g class="compass-center" onclick="App.startDaily()" role="button" aria-label="Tagesaufgabe starten">' +
      '<circle class="hub" cx="190" cy="170" r="30" fill="var(--gold)" stroke="var(--paper-raised)" stroke-width="4"/>' +
      '<text x="190" y="167" text-anchor="middle" font-size="18">\u2600\uFE0F</text>' +
      '<text x="190" y="182" text-anchor="middle" font-size="8" fill="#3a2705" font-weight="700">HEUTE</text>' +
    '</g>' +
    '</svg>';
}
function tickMarks(){
  var s='';
  var cx=190, cy=170;
  for(var i=0;i<24;i++){
    var ang = i*15*Math.PI/180;
    var r1 = 150, r2 = i%6===0? 138:144;
    var x1 = cx+r1*Math.sin(ang), y1=cy-r1*Math.cos(ang);
    var x2 = cx+r2*Math.sin(ang), y2=cy-r2*Math.cos(ang);
    s += '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="var(--line)" stroke-width="'+(i%6===0?2:1)+'"/>';
  }
  return s;
}
function dirGroup(cx,cy,letter,label,color,onclick){
  return '<g class="compass-dir" onclick="'+onclick+'" role="button" tabindex="0" aria-label="'+label+'" ' +
    'onkeypress="if(event.key===\'Enter\'){'+onclick+'}">' +
    '<circle class="dir-bg" cx="'+cx+'" cy="'+cy+'" r="30" fill="'+color+'"/>' +
    '<text x="'+cx+'" y="'+(cy+7)+'" text-anchor="middle" font-size="20" fill="#fff">'+letter+'</text>' +
    labelText(cx,cy,label) +
    '</g>';
}
function labelText(cx,cy,label){
  var ty;
  if(cy<170){ ty = cy-40; } else if(cy>170){ ty = cy+48; } else { ty = cy+50; }
  return '<text x="'+cx+'" y="'+ty+'" text-anchor="middle" font-size="11.5" fill="var(--ink)" font-weight="700">'+label+'</text>';
}

/* ===================== TOPIC SELECT ===================== */
function screenTopicSelect(){
  var html = topbar('\u00dcbungsmodus w\u00e4hlen', true, "App.go('landing')");
  html += '<div class="section"><div class="section-title">\u{1F4DA} Deutsch</div><div class="tile-grid">';
  TOPIC_TESTS.deutsch.forEach(function(tn){ html += chapterTile(tn); });
  html += '</div></div>';
  html += '<div class="section"><div class="section-title">\u{1F522} Mathematik</div><div class="tile-grid">';
  TOPIC_TESTS.mathematik.forEach(function(tn){ html += chapterTile(tn); });
  html += '</div></div>';
  return html;
}
function chapterTile(testNum){
  var meta = CHAPTER_META[testNum];
  var acc = chapterAccuracy(testNum);
  return '<button class="tile" onclick="App.go(\'chapterConfig\','+testNum+')">' +
    '<div class="tile-icon" style="background:'+meta.color+';">'+meta.icon+'</div>' +
    '<div class="tile-body"><div class="tile-title">'+meta.name+'</div>' +
    '<div class="tile-sub">'+ (acc.seen>0 ? acc.pct+'% richtig \u00b7 '+acc.seen+' ge\u00fcbt' : '50 Fragen \u00b7 noch nicht ge\u00fcbt') +'</div>' +
    (acc.seen>0 ? '<div class="tile-progress"><div class="tile-progress-fill" style="width:'+acc.pct+'%;background:'+meta.color+';"></div></div>' : '') +
    '</div><div class="tile-chevron">\u203A</div></button>';
}

/* ===================== CHAPTER CONFIG (choose length) ===================== */
function screenChapterConfig(testNum){
  var meta = CHAPTER_META[testNum];
  var html = topbar(meta.name, true, "App.go('topicSelect')");

function bestExamScore(testNum){

  PROGRESS.history.forEach(function(h){

      if(best===null || h.score>best) best=h.score;
    }
  });
  return best;
}

/* ===================== QUIZ ENGINE ===================== */
function buildQuizSession(opts){
  // opts: {mode:'practice'|'exam'|'daily'|'mistakes', questions:[...], testNum, topicKey, timeLimitSec}
  return {
    mode:opts.mode,
    testNum:opts.testNum || null,
    topicKey:opts.topicKey || null,
    label:opts.label || '',
    questions:opts.questions,
    index:0,
    answers:new Array(opts.questions.length).fill(null),
    confidences:new Array(opts.questions.length).fill(null),
    revealed:new Array(opts.questions.length).fill(opts.mode==='exam' ? false : false),
    startTime:Date.now(),
    timeLimitSec:opts.timeLimitSec || null,
    timerHandle:null,
    finished:false
  };
}

App.startTopic = function(subjectKey){
  App.go('topicSelect');
};
App.beginTopicPractice = function(testNum){
  var t = TESTS_BY_NUM[testNum];
  var n = App.selectedLen;
  var qs = shuffle(t.questions).slice(0, Math.min(n, t.questions.length));
  state.quiz = buildQuizSession({mode:'practice', questions:qs, testNum:testNum, label:CHAPTER_META[testNum].name});
  App.go('quiz');
};
App.startExam = function(testNum){
  var t = TESTS_BY_NUM[testNum];
  state.quiz = buildQuizSession({mode:'exam', questions:t.questions.slice(), testNum:testNum, label:t.chapter, timeLimitSec:60*60});
  App.go('quiz');
  startTimer();
};
App.startDaily = function(){
  var seed = dateSeedToday();
  var pool = seededShuffle(ALL_QUESTIONS, seed);
  var qs = pool.slice(0,10);
  state.quiz = buildQuizSession({mode:'daily', questions:qs, label:'Tagesaufgabe'});
  App.go('quiz');
};
App.startMistakeReview = function(){
  var ids = Object.keys(PROGRESS.mistakeBank);
  var qs = ids.map(function(id){ return QUESTIONS_BY_ID[id]; }).filter(Boolean);
  if(qs.length===0) return;
  qs = shuffle(qs);
  state.quiz = buildQuizSession({mode:'mistakes', questions:qs, label:'Fehlerspeicher'});
  App.go('quiz');
};

function startTimer(){
  clearInterval(state.quiz.timerHandle);
  state.quiz.timerHandle = setInterval(function(){
    if(!state.quiz || state.quiz.finished){ clearInterval(state.quiz && state.quiz.timerHandle); return; }
    var elapsed = (Date.now()-state.quiz.startTime)/1000;
    var remaining = state.quiz.timeLimitSec - elapsed;
    var pill = document.getElementById('timer-pill');
    if(pill){
      pill.textContent = fmtTime(remaining);
      pill.classList.toggle('low', remaining<120);
    }
    if(remaining<=0){
      clearInterval(state.quiz.timerHandle);
      App.finishQuiz();
    }
  },1000);
}

function screenQuiz(){
  var q = state.quiz;
  var cur = q.questions[q.index];
  var meta = q.testNum ? CHAPTER_META[q.testNum] : null;
  var title = q.label;

  html += '<div class="quiz-header">';
  html += '<div class="quiz-progress-row"><div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:'+ Math.round(((q.index)/q.questions.length)*100) +'%;"></div></div>';
  if(q.timeLimitSec){
    html += '<span class="timer-pill" id="timer-pill">'+fmtTime(q.timeLimitSec - (Date.now()-q.startTime)/1000)+'</span>';
  }
  html += '</div>';
  html += '<div class="quiz-meta"><span>Frage '+(q.index+1)+' von '+q.questions.length+'</span><span>'+subjectLabel(cur.subject)+'</span></div>';
  html += '</div>';

  // passage (Leseverstaendnis)
  if(cur.passageNum && PASSAGES[cur.passageNum]){
    var p = PASSAGES[cur.passageNum];
    html += '<div class="passage-card"><div class="passage-title">\u{1F4D6} '+esc(p.title)+'</div><div class="passage-text">'+esc(p.text)+'</div></div>';
  }

  var revealed = q.revealed[q.index];
  var chosen = q.answers[q.index];

  html += '<div class="card question-card">';
  html += '<div class="question-num">Frage '+(q.index+1)+'</div>';
  html += '<div class="question-text">'+esc(cur.text)+'</div>';
  html += '<div class="options">';
  ['A','B','C','D'].forEach(function(letter){
    var cls='option-btn';
    var disabled = revealed ? 'disabled' : '';
    if(revealed){
      if(letter===cur.answer) cls+=' correct';
      else if(letter===chosen && letter!==cur.answer) cls+=' incorrect';
    } else if(letter===chosen){
      cls+=' selected';
    }
    html += '<button class="'+cls+'" '+disabled+' onclick="App.selectOption(\''+letter+'\')">' +
      '<span class="option-letter">'+letter+'</span><span>'+esc(cur.options[letter])+'</span></button>';
  });
  html += '</div>';

  if(!revealed && q.mode!=='exam'){
    html += '<div class="confidence-row">' +
      confBtn('sicher','\u{1F4AA} Sicher', q) +
      confBtn('unsicher','\u{1F914} Unsicher', q) +
      '</div>';
  }

  if(revealed){
    var isCorrect = chosen===cur.answer;
    html += '<div class="feedback-box '+(isCorrect?'correct':'incorrect')+'">' +
      '<div class="feedback-label '+(isCorrect?'correct':'incorrect')+'">'+(isCorrect? (ICO.check+' Richtig!') : (ICO.x+' Nicht ganz.'))+'</div>' +
      '<div>'+esc(cur.explanation)+'</div></div>';
  }

  html += '</div>'; // card

  html += '<div class="quiz-actions">';
  html += '<button class="speak-btn" aria-label="Vorlesen" onclick="App.speakQuestion()">'+ICO.speak+'</button>';
  if(q.mode==='exam'){
    html += '<button class="btn btn-primary grow" onclick="App.nextQuestion()">'+(q.index+1<q.questions.length? 'N\u00e4chste Frage':'Pr\u00fcfung abgeben')+'</button>';
  } else {
    if(!revealed){
      html += '<button class="btn btn-primary grow" '+(chosen?'':'disabled')+' onclick="App.revealAnswer()">Antwort pr\u00fcfen</button>';
    } else {
      html += '<button class="btn btn-teal grow" onclick="App.nextQuestion()">'+(q.index+1<q.questions.length? 'Weiter':'Ergebnis ansehen')+'</button>';
    }
  }
  html += '</div>';

  return html;
}
function confBtn(val,label,q){
  var active = q.confidences[q.index]===val;
  return '<button class="confidence-btn'+(active?' active':'')+'" onclick="App.setConfidence(\''+val+'\')">'+label+'</button>';
}
function subjectLabel(s){
  return s==='deutsch' ? '\u{1F4DA} Deutsch' : '\u{1F522} Mathematik';
}

App.selectOption = function(letter){
  var q = state.quiz;
  if(q.revealed[q.index]) return;
  q.answers[q.index] = letter;
  render(screenQuiz());
};
App.setConfidence = function(val){
  var q = state.quiz;
  q.confidences[q.index] = val;
  render(screenQuiz());
};
App.revealAnswer = function(){
  var q = state.quiz;
  if(!q.answers[q.index]) return;
  q.revealed[q.index] = true;
  var cur = q.questions[q.index];
  if(q.answers[q.index] !== cur.answer){
    PROGRESS.mistakeBank[cur.id] = {wrongCount:(PROGRESS.mistakeBank[cur.id]? PROGRESS.mistakeBank[cur.id].wrongCount:0)+1, lastWrongDate:new Date().toISOString()};
  } else {
    if(q.mode==='mistakes' && PROGRESS.mistakeBank[cur.id]){
      delete PROGRESS.mistakeBank[cur.id];
    }
  }
  render(screenQuiz());
};
App.nextQuestion = function(){
  var q = state.quiz;
  if(q.index+1 < q.questions.length){
    q.index++;
    render(screenQuiz());
  } else {
    App.finishQuiz();
  }
};
App.confirmExitQuiz = function(){
  if(confirm('\u00dcbung wirklich verlassen? Dein Fortschritt in dieser Runde geht verloren.')){
    clearInterval(state.quiz && state.quiz.timerHandle);
    state.quiz = null;
    App.go('landing');
  }
};
App.speakQuestion = function(){
  try{
    var q = state.quiz;
    var cur = q.questions[q.index];
    var text = cur.text + '. Antwort A: '+cur.options.A+'. B: '+cur.options.B+'. C: '+cur.options.C+'. D: '+cur.options.D;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){ alert('Vorlesen wird von diesem Ger\u00e4t leider nicht unterst\u00fctzt.'); }
};

App.finishQuiz = function(){
  var q = state.quiz;
  clearInterval(q.timerHandle);
  q.finished = true;

  // score, for exam mode we must reveal + mistake bank now
  var correct=0;
  var chapterStats = {};
  q.questions.forEach(function(cur, i){
    var isCorrect = q.answers[i]===cur.answer;
    if(isCorrect) correct++;
    else {
      PROGRESS.mistakeBank[cur.id] = {wrongCount:(PROGRESS.mistakeBank[cur.id]? PROGRESS.mistakeBank[cur.id].wrongCount:0)+1, lastWrongDate:new Date().toISOString()};
    }
    if(isCorrect && q.mode==='mistakes' && PROGRESS.mistakeBank[cur.id]) delete PROGRESS.mistakeBank[cur.id];
    var chKey = cur.chapterKeyOverride || (findChapterForQuestion(cur));
    if(!chapterStats[chKey]) chapterStats[chKey]={total:0,correct:0};
    chapterStats[chKey].total++;
    if(isCorrect) chapterStats[chKey].correct++;
  });

  var durationSec = Math.round((Date.now()-q.startTime)/1000);
  var histEntry = {
    date:new Date().toISOString(),
    mode:q.mode,
    testNum:q.testNum,
    label:q.label,
    score:correct,
    total:q.questions.length,
    durationSec:durationSec,
    chapterStats:chapterStats
  };
  PROGRESS.history.push(histEntry);
  PROGRESS.lastSession = histEntry.date;

  var newBadges = evaluateBadges(histEntry);
  newBadges.forEach(function(b){ if(PROGRESS.badges.indexOf(b)===-1) PROGRESS.badges.push(b); });

  if(q.mode==='exam'){
    PROGRESS.leaderboard.push({name:PROGRESS.profileName, score:correct, total:q.questions.length, mode:q.testNum, date:histEntry.date});
  }

  saveIndicator();
  state.lastResult = {entry:histEntry, quiz:q, newBadges:newBadges};
  App.go('results');
};

function findChapterForQuestion(q){
  // reverse-lookup: which testNum in TOPIC_TESTS pools contains a question with this id range; fallback to subject label
  for(var tn=11; tn<=16; tn++){
    var t = TESTS_BY_NUM[tn];
    for(var i=0;i<t.questions.length;i++){
      if(t.questions[i].id===q.id) return tn;
    }
  }
  return q.subject==='deutsch' ? 'deutsch-allg' : 'mathematik-allg';
}

/* ===================== BADGES ===================== */
var BADGE_DEFS = {
  first_session:{icon:'\u{1F31F}', name:'Erste Schritte'},
  perfect_score:{icon:'\u{1F3C6}', name:'Alles richtig!'},
  streak5:{icon:'\u{1F525}', name:'5er-Serie'},
  math_meister:{icon:'\u{1F9EE}', name:'Mathe-Meister'},
  rechtschreib_profi:{icon:'\u{1F58A}\uFE0F', name:'Rechtschreib-Profi'},
  exam_finisher:{icon:'\u{1F3C1}', name:'Pr\u00fcfung geschafft'},
  fehlerjaeger:{icon:'\u{1F50D}', name:'Fehlerj\u00e4ger'}
};
function evaluateBadges(entry){
  var newB = [];
  if(PROGRESS.history.length===1) newB.push('first_session');
  if(entry.score===entry.total && entry.total>=10) newB.push('perfect_score');
  var s = overallStats();
  if(s.streak>=5) newB.push('streak5');
  if(entry.testNum===14 && entry.score/entry.total>=0.9) newB.push('math_meister');
  if(entry.testNum===12 && entry.score/entry.total>=0.9) newB.push('rechtschreib_profi');
  if(entry.mode==='exam') newB.push('exam_finisher');
  if(entry.mode==='mistakes' && entry.score===entry.total) newB.push('fehlerjaeger');
  return newB;
}

    html += '<div style="font-size:0.85rem;color:var(--ink-soft);">Noch keine Pr\u00fcfung abgelegt. Starte eine im Pr\u00fcfungsmodus!</div>';
  } else {
    var sorted = PROGRESS.leaderboard.slice().sort(function(a,b){ return (b.score/b.total)-(a.score/a.total); }).slice(0,10);
    sorted.forEach(function(row,i){
      html += '<div class="lb-row"><div class="lb-rank">'+(i+1)+'</div><div class="lb-name">'+esc(row.name)+'<div style="font-size:0.7rem;color:var(--ink-soft);">Test '+row.mode+' \u00b7 '+new Date(row.date).toLocaleDateString('de-DE')+'</div></div><div class="lb-score">'+row.score+'/'+row.total+'</div></div>';
    });
  }
  html += '</div></div>';

  html += '<div class="section"><div class="card">';
  html += '<div class="section-title">\u{1F4BE} Fortschritt sichern</div>';
  html += '<div style="font-size:0.85rem;color:var(--ink-soft);margin-bottom:14px;">Diese App speichert nichts automatisch im Browser. Lade deine Datei herunter, um sp\u00e4ter weiterzumachen \u2014 und lade sie beim n\u00e4chsten Mal wieder hoch.</div>';
  html += '<div class="row"><button class="btn btn-primary grow" onclick="App.exportProgress()">\u2B07\uFE0F Exportieren</button>' +
    '<button class="btn btn-ghost grow" onclick="document.getElementById(\'import-file-input\').click()">\u2B06\uFE0F Importieren</button></div>';
  html += '<input type="file" id="import-file-input" accept="application/json" style="display:none" onchange="App.importProgress(this.files[0])"/>';
  html += '</div></div>';

  html += '<div class="section"><button class="btn btn-ghost btn-block" onclick="App.resetProgress()">Fortschritt zur\u00fccksetzen</button></div>';

  return html;
}
App.setProfileName = function(v){
  PROGRESS.profileName = v.trim() || 'Entdecker';
  saveIndicator();
};
App.exportProgress = function(){
  var blob = new Blob([JSON.stringify(PROGRESS,null,1)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var datePart = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'kompass4-fortschritt-'+(PROGRESS.profileName||'profil').replace(/[^a-z0-9\-]/gi,'_')+'-'+datePart+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); },1000);
};
App.importProgress = function(file){
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var data = JSON.parse(e.target.result);
      if(!data || typeof data!=='object' || !Array.isArray(data.history)){
        alert('Diese Datei scheint kein g\u00fcltiger Kompass-4-Fortschritt zu sein.');
        return;
      }
      PROGRESS = Object.assign(freshProgress(), data);
      applySettingsToDom();
      saveIndicator();
      render(screenProfile());
      alert('Fortschritt erfolgreich geladen!');
    }catch(err){
      alert('Die Datei konnte nicht gelesen werden. Bitte w\u00e4hle eine g\u00fcltige Kompass-4-Fortschrittsdatei.');
    }
  };
  reader.readAsText(file);
};
App.resetProgress = function(){
  if(confirm('Wirklich den gesamten Fortschritt l\u00f6schen? Das kann nicht r\u00fcckg\u00e4ngig gemacht werden \u2014 exportiere vorher, falls du ihn behalten m\u00f6chtest.')){
    PROGRESS = freshProgress();
    applySettingsToDom();
    App.go('landing');
  }
};

/* ===================== ROUTER ===================== */
App.go = function(screen, arg){
  state.screen = screen;
  if(screen==='landing') render(screenLanding());
  else if(screen==='topicSelect') render(screenTopicSelect());
  else if(screen==='chapterConfig') render(screenChapterConfig(arg));
  else if(screen==='examSelect') render(screenExamSelect());
  else if(screen==='quiz') render(screenQuiz());
  else if(screen==='results') render(screenResults());
  else if(screen==='mistakes') render(screenMistakes());
  else if(screen==='settings') render(screenSettings());
  else if(screen==='profile') render(screenProfile());
};

/* expose */
window.App = App;

/* ===================== INIT ===================== */
applySettingsToDom();
App.go('landing');

})();
</script>

</html>
